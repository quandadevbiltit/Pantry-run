<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- lay the page out at the phone's real width, edge to edge -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F6F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1418" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<!-- open full screen when launched from the home screen -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pantry Run">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
/* what the Claude viewer used to provide */
html,body{margin:0;padding:0}
img{max-width:100%}
[hidden]:not([hidden=until-found i]){display:none!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
</style>
<title>Pantry Run</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  /* cool slate + teal — one palette for the whole app */
  --ground:#F4F6F8; --surface:#FFFFFF; --surface-2:#EDF1F5; --surface-3:#F8FAFC;
  --ink:#1A2430; --ink-2:#4B5A6B; --ink-3:#64748B;
  --line:#E3E8EE; --line-2:#CFD8E2;
  --accent:#0C7168; --accent-ink:#FFFFFF; --accent-soft:#E6F4F1; --accent-line:#A7D6CF;
  --warn:#9A6212; --warn-soft:#FAF1E2; --warn-line:#E7CFA4;
  --alert:#A3423C; --alert-soft:#FAEBE9; --on-alert:#fff;
  --star:var(--accent);
  --shadow-1:0 1px 2px rgba(26,36,48,.05);
  --shadow-2:0 1px 3px rgba(26,36,48,.06),0 12px 28px rgba(26,36,48,.10);
  --sans:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --disp:var(--sans);
  --mono:var(--sans);
  --r:16px; --r-sm:12px;
  /* spacing scale */
  --gap-1:8px; --gap-2:12px; --gap-3:16px; --gap-4:24px; --gap-5:32px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0F1418; --surface:#18202A; --surface-2:#222C38; --surface-3:#141C24;
    --ink:#E8EDF2; --ink-2:#A8B5C2; --ink-3:#8D9BAA;
    --line:#26313D; --line-2:#36434F;
    --accent:#4FC0B2; --accent-ink:#06201D; --accent-soft:#16302E; --accent-line:#2B5751;
    --warn:#D6A35F; --warn-soft:#2A2318; --warn-line:#473A24;
    --alert:#DE8F88; --alert-soft:#2C1D1C; --on-alert:#2A1110;
    --star:var(--accent);
    --shadow-1:0 1px 2px rgba(0,0,0,.35);
    --shadow-2:0 1px 3px rgba(0,0,0,.4),0 12px 28px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --ground:#0F1418; --surface:#18202A; --surface-2:#222C38; --surface-3:#141C24;
  --ink:#E8EDF2; --ink-2:#A8B5C2; --ink-3:#8D9BAA;
  --line:#26313D; --line-2:#36434F;
  --accent:#4FC0B2; --accent-ink:#06201D; --accent-soft:#16302E; --accent-line:#2B5751;
  --warn:#D6A35F; --warn-soft:#2A2318; --warn-line:#473A24;
  --alert:#DE8F88; --alert-soft:#2C1D1C; --on-alert:#2A1110;
  --star:var(--accent);
  --shadow-1:0 1px 2px rgba(0,0,0,.35);
  --shadow-2:0 1px 3px rgba(0,0,0,.4),0 12px 28px rgba(0,0,0,.45);
}

*{box-sizing:border-box;min-width:0}
body{
  background:var(--ground); color:var(--ink);
  font-family:var(--sans); font-size:15px; line-height:1.45;
  -webkit-text-size-adjust:100%; -webkit-tap-highlight-color:transparent;
  overflow-x:hidden;
}
button,summary,[role="checkbox"],[role="switch"],label{touch-action:manipulation}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0;text-align:left}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;letter-spacing:-.01em}

/* ---------- shell ---------- */
.wrap{max-width:560px;margin-inline:auto;padding-inline:clamp(16px,4.4vw,20px)}
/* --nav-h and --bar-h are measured at runtime so content always clears the fixed bars */
#screens{padding-bottom:calc(var(--nav-h,76px) + 24px)}
body.has-bar #screens{padding-bottom:calc(var(--nav-h,76px) + var(--bar-h,150px) + 24px)}

.appbar{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:30;
  background:color-mix(in srgb,var(--ground) 88%,transparent);
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
}
.appbar .wrap{display:flex;align-items:center;gap:10px;padding-block:12px 10px;min-height:56px}
.appbar h1{
  font-family:var(--disp);font-weight:700;font-size:23px;line-height:1.12;margin:0;
  letter-spacing:-.022em;flex:1;text-wrap:balance;
}
.appbar .sub{display:block;font-family:var(--sans);font-weight:600;font-size:11px;
  letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);margin-bottom:4px}

.iconbtn{
  width:44px;height:44px;flex:0 0 44px;border-radius:var(--r-sm);
  display:grid;place-items:center;color:var(--ink-2);
  border:1px solid transparent;transition:background .14s ease,color .14s ease;
}
.iconbtn:hover{background:var(--surface-2);color:var(--ink)}
.appbar .iconbtn{background:var(--accent-soft);color:var(--accent)}
.appbar .iconbtn:hover{background:var(--accent);color:var(--accent-ink)}
.iconbtn svg{width:20px;height:20px}

/* ---------- bottom nav ---------- */
nav.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:color-mix(in srgb,var(--surface) 92%,transparent);
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;padding-block:6px;padding-inline:8px}
.tab{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  padding:7px 2px 6px;border-radius:10px;color:var(--ink-3);min-height:52px;
}
.tab svg{width:21px;height:21px;stroke-width:1.7}
.tab span{font-family:var(--disp);font-weight:600;font-size:10.5px;letter-spacing:.02em}
.tab[aria-selected="true"]{color:var(--accent);background:var(--accent-soft)}
.tab .badge{
  position:absolute;transform:translate(15px,-9px);
  background:var(--accent);color:var(--accent-ink);border-radius:20px;
  font-family:var(--mono);font-size:9.5px;font-weight:600;line-height:1;
  padding:3px 5px;min-width:16px;text-align:center;
}

/* ---------- blocks ---------- */
.sec{margin-top:var(--gap-4)}
.sec-head{display:flex;align-items:baseline;gap:8px;margin-bottom:10px;padding-inline:2px}
.sec-head h2{
  font-family:var(--disp);font-weight:600;font-size:11.5px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--ink-3);margin:0;
}
.sec-head .count{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.sec-head .spacer{flex:1}
.sec-note{font-size:12.5px;color:var(--ink-3);margin:-4px 2px 9px;line-height:1.4}

/* LIST-GROUP CARD — one rounded container, rows divided inside it */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stack{display:flex;flex-direction:column}
.stack>*+*{border-top:1px solid var(--line)}

.empty{
  background:var(--surface-3);border:1px solid var(--line);border-radius:var(--r);
  padding:26px 20px;text-align:center;color:var(--ink-3);font-size:13.5px;line-height:1.55;
}
.empty strong{display:block;color:var(--ink-2);font-weight:600;font-size:15px;margin-bottom:5px}
.empty .eicon{width:26px;height:26px;margin:0 auto 10px;color:var(--line-2);display:block}

/* ---------- buttons ---------- */
/* SECONDARY BUTTON is the base; .primary, .action and .dangerfill build on it */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:48px;padding:0 18px;border-radius:var(--r-sm);
  font-family:var(--disp);font-weight:600;font-size:14.5px;letter-spacing:-.005em;
  background:var(--surface);color:var(--ink);border:1px solid var(--line-2);
  transition:background .14s ease,border-color .14s ease,color .14s ease;
}
.btn:hover{background:var(--surface-2)}
/* ACTION CARD — a tinted, lower-emphasis secondary action */
.btn.action{background:var(--accent-soft);border-color:transparent;color:var(--accent);justify-content:flex-start;gap:10px;padding:0 16px}
.btn.action:hover{background:var(--accent-soft);border-color:var(--accent-line)}
.btn.action svg{color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.danger{color:var(--alert);border-color:var(--line-2)}
.btn.danger:hover{background:var(--alert-soft)}
.btn.block{display:flex;width:100%}
.btn.sm{min-height:44px;padding:0 13px;font-size:13.5px;border-radius:10px;flex:0 0 auto}
.btn:disabled{opacity:.45;cursor:default}
.btn svg{width:17px;height:17px;flex:0 0 17px}
.btnrow{display:flex;gap:9px;margin-top:12px}
.btnrow>*{flex:1}

/* QUICK ACTION — teal on a soft teal tint, 44px to the touch */
.addbtn{
  flex:0 0 44px;width:44px;height:44px;border-radius:var(--r-sm);
  background:var(--accent-soft);color:var(--accent);border:1px solid transparent;
  display:grid;place-items:center;transition:background .14s ease,color .14s ease;
}
.addbtn:hover{background:var(--accent);color:var(--accent-ink)}
.addbtn svg{width:19px;height:19px;stroke-width:2.2}
/* solid = on the list; tapping it takes the product back off */
.addbtn.done{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.addbtn.done:hover,.addbtn.done:focus-visible{background:var(--alert);border-color:var(--alert);color:#fff}
.addbtn .i-on,.addbtn .i-off{display:grid;place-items:center}
.addbtn .i-off{display:none}
.addbtn.done:hover .i-on,.addbtn.done:focus-visible .i-on{display:none}
.addbtn.done:hover .i-off,.addbtn.done:focus-visible .i-off{display:grid}
.addbtn.mark{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}

/* ---------- pills / chips ---------- */
.pill{
  display:inline-flex;align-items:center;gap:4px;
  font-family:var(--disp);font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  padding:3px 7px;border-radius:5px;background:var(--surface-2);color:var(--ink-2);
}
.pill.low{background:var(--warn-soft);color:var(--warn)}
.pill.need{background:var(--alert-soft);color:var(--alert)}
.pill.wt{background:var(--accent-soft);color:var(--accent)}

.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 16px 2px;margin-inline:-16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;padding:7px 14px;border-radius:22px;min-height:44px;
  border:1px solid var(--line-2);background:var(--surface);
  font-size:13.5px;font-weight:500;color:var(--ink-2);white-space:nowrap;
  display:inline-flex;align-items:center;
}
.chip{transition:background .14s ease,color .14s ease,border-color .14s ease}
.chip[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line);font-weight:600}

.seg{display:flex;background:var(--surface-2);border-radius:var(--r-sm);padding:3px;gap:3px}
.seg button{
  flex:1;min-height:44px;border-radius:9px;text-align:center;
  font-family:var(--disp);font-weight:600;font-size:13px;line-height:1.15;color:var(--ink-2);
  display:flex;align-items:center;justify-content:center;
  padding:4px;text-wrap:balance;
}
.seg.three button{font-size:12.5px;letter-spacing:-.01em}
.seg button{transition:background .16s ease,color .16s ease}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
@media (prefers-reduced-motion:reduce){.seg button,.chip,.btn,.addbtn,.iconbtn{transition:none}}

/* ---------- home ---------- */
/* PRIMARY CARD — the one summary that earns a little depth */
.trip-card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:18px;box-shadow:var(--shadow-1);
}
.trip-card .line{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:14px}
.trip-card .k{font-family:var(--disp);font-size:clamp(9.5px,2.9vw,11px);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-bottom:2px}
.trip-card .items{font-family:var(--disp);font-weight:600;font-size:clamp(16px,4.9vw,19px);letter-spacing:-.015em;text-wrap:balance}
.trip-card .total{font-weight:700;font-size:clamp(21px,6.6vw,27px);letter-spacing:-.03em}
.trip-card .line>div:last-child{flex:0 0 auto}
.trip-card .miss{
  display:flex;align-items:flex-start;gap:6px;font-size:12.5px;color:var(--warn);
  font-weight:500;line-height:1.4;margin:-4px 0 12px;
}
.trip-card .miss svg{width:14px;height:14px;flex:0 0 14px;margin-top:2px}

/* ---------- rows ---------- */
.row{display:flex;align-items:center;gap:12px;padding:11px 13px;min-height:58px}
.row .body{flex:1;min-width:0}
.row .name{font-weight:550;font-size:15px;line-height:1.3;overflow-wrap:anywhere}
.row .meta{font-size:12.5px;color:var(--ink-3);margin-top:2px;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.row .meta .num{font-size:12.5px}
.row .meta svg,.selrow .meta svg{width:13px;height:13px;flex:0 0 13px;color:var(--ink-3)}
.row .price{font-family:var(--mono);font-size:14px;font-weight:500;text-align:right;white-space:nowrap}
.row.tappable:hover{background:var(--surface-3)}
.dot{color:var(--line-2)}

/* ---------- list item ---------- */
.li{padding:11px 11px 10px;display:flex;gap:4px;align-items:flex-start}
.li.done{opacity:.62}
/* 44px hit area, 27px visual box */
.check{
  flex:0 0 44px;width:44px;height:44px;margin-top:-4px;
  display:grid;place-items:center;
}
.check .box{
  width:28px;height:28px;border-radius:9px;
  border:2px solid var(--line-2);background:var(--surface);
  display:grid;place-items:center;color:transparent;
  transition:background .12s,border-color .12s;
}
.check:hover .box{border-color:var(--accent)}
.check .box svg{width:16px;height:16px;stroke-width:3}
.check[aria-checked="true"] .box{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
@media (prefers-reduced-motion:reduce){.check .box{transition:none}}
.li .main{flex:1;min-width:0}
.li .top{display:flex;gap:10px;align-items:flex-start}
.li .nm{flex:1;min-width:0;font-weight:550;font-size:15px;line-height:1.3;overflow-wrap:anywhere}
.li.done .nm{text-decoration:line-through;text-decoration-color:var(--ink-3)}
.li .tot{font-family:var(--mono);font-weight:600;font-size:15px;white-space:nowrap;letter-spacing:-.02em}
.li .tot.missing{color:var(--warn);font-size:13px;font-weight:500}
/* remove stays a fixed right-hand column so meta text wraps beneath it,
   never pushing it onto a line of its own; row-gap clears the tap areas */
.li .sub{display:flex;flex-wrap:nowrap;align-items:flex-start;gap:6px;margin-top:3px;padding-right:2px}
.li .subwrap{
  flex:1 1 auto;min-width:0;display:flex;flex-wrap:wrap;align-items:center;
  gap:6px;row-gap:14px;font-size:12px;color:var(--ink-3);padding-block:4px;
}
.li .sub .rm{flex:0 0 32px;margin-left:0}
/* store chip: 32px visual, 44px hit area via padding + negative margin */
/* 32px chip, but ::after pushes the real tap area out to 44px without
   bloating the meta line's rhythm */
.li .chipbtn{
  position:relative;
  display:inline-flex;align-items:center;min-height:32px;padding:6px 10px;margin-block:-6px;
  max-width:100%;border-radius:16px;border:1px solid var(--line);background:var(--surface-3);
  color:var(--ink-2);font-size:12px;line-height:1.25;overflow-wrap:anywhere;
}
.li .chipbtn::after{content:"";position:absolute;inset:-6px -2px}
.li .chipbtn:hover{color:var(--accent);border-color:var(--accent-line);background:var(--accent-soft)}
/* an item with no category is worth noticing, and one tap from fixing */
.li .chipbtn.unset{background:var(--warn-soft);border-color:var(--warn-line);color:var(--warn);font-weight:500}
.li .chipbtn.unset:hover{background:var(--warn);border-color:var(--warn);color:#fff}
.li .ctl{display:flex;align-items:center;gap:7px;margin-top:10px;flex-wrap:wrap;row-gap:7px}

.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;background:var(--surface)}
.stepper button{width:44px;height:44px;display:grid;place-items:center;color:var(--accent);background:var(--accent-soft)}
.stepper button:hover{background:var(--accent);color:var(--accent-ink)}
.stepper button svg{width:16px;height:16px;stroke-width:2.2}
.stepper{flex:0 0 auto}
.stepper .v{
  min-width:30px;text-align:center;font-weight:600;font-size:15px;font-variant-numeric:tabular-nums;
  border-inline:1px solid var(--line);align-self:stretch;display:grid;place-items:center;padding-inline:4px;
  background:var(--surface);
}
.stepper .del{color:var(--alert);background:var(--alert-soft)}
.stepper .del:hover{background:var(--alert);color:var(--on-alert)}

.wtin{
  display:inline-flex;align-items:center;gap:5px;height:44px;padding:0 11px;
  border:1px solid var(--line-2);border-radius:11px;background:var(--surface);
}
.wtin input{
  width:64px;height:44px;border:none;background:transparent;padding:0;
  font-family:var(--mono);font-weight:600;font-size:16px;text-align:right;
}
.wtin input:focus{outline:none}
.wtin:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.wtin .u{font-size:12px;color:var(--ink-3);font-weight:500}

.pricebtn{
  display:inline-flex;align-items:center;justify-content:center;gap:5px;height:44px;padding:0 12px;border-radius:11px;
  border:1px solid var(--line-2);background:var(--surface);
  font-family:var(--mono);font-size:13.5px;font-weight:500;white-space:nowrap;
  flex:0 0 auto;min-width:max-content;
}
.pricebtn:hover{border-color:var(--accent);color:var(--accent)}
.pricebtn.actual{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent);font-weight:600}
.pricebtn.missing{background:var(--warn-soft);border-color:var(--warn-line);color:var(--warn)}
.pricebtn .ea{font-family:var(--sans);font-size:11.5px;color:var(--ink-3)}
.pricebtn.actual .ea{color:var(--accent)}
.pricebtn.missing .ea{color:var(--warn)}
/* 32px visual, 44px tap area — secondary to the stepper and price */
.rm{position:relative;margin-left:auto;width:32px;height:32px;flex:0 0 32px;border-radius:9px;display:grid;place-items:center;color:var(--ink-3)}
.rm::after{content:"";position:absolute;inset:-6px -3px}
.rm:hover{background:var(--alert-soft);color:var(--alert)}
.rm svg{width:16px;height:16px}
.settings-rm{width:44px;height:44px;flex:0 0 44px;border-radius:11px}
.settings-rm::after{content:none}
.rm.confirm{background:var(--alert);color:#fff}
.rm.confirm:hover{background:var(--alert);color:#fff}

/* ---- duplicate warning ---- */
.dupnote{
  display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;
  background:var(--warn-soft);border:1px solid var(--warn-line);color:var(--ink-2);
  font-size:14.5px;line-height:1.45;
}
.dupnote svg{width:18px;height:18px;flex:0 0 18px;color:var(--warn);margin-top:1px}
.dupnote b{color:var(--ink);font-weight:600}
.duprow{align-items:center}
.dupwhy{font-size:11px;font-family:var(--disp);font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--warn);margin-top:4px}

/* ---- trip deletion confirmation ---- */
.impact{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.impact li{
  position:relative;padding:10px 12px 10px 34px;border-radius:10px;font-size:13.5px;line-height:1.45;
  background:var(--alert-soft);color:var(--ink-2);
}
.impact li::before{
  content:"";position:absolute;left:13px;top:15px;width:10px;height:2px;border-radius:2px;background:var(--alert);
}
.impact li b{color:var(--ink);font-weight:600}
.impact.keep li{background:var(--accent-soft)}
.impact.keep li::before{width:6px;height:10px;top:13px;left:15px;background:none;
  border:solid var(--accent);border-width:0 2px 2px 0;transform:rotate(45deg);border-radius:0}
.btn.dangerfill{background:var(--alert);color:var(--on-alert);border-color:transparent}
/* backup & restore */
.cmp{width:100%;border-collapse:collapse;font-size:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.cmp th,.cmp td{padding:9px 12px;text-align:right;border-bottom:1px solid var(--line);font-weight:500}
.cmp tr:last-child th,.cmp tr:last-child td{border-bottom:none}
.cmp th[scope=row]{text-align:left;font-family:var(--sans);font-weight:400;color:var(--ink-3)}
.cmp thead th{font-family:var(--sans);font-size:12px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em}
.cmp tr.diff td:last-child{color:var(--accent);font-weight:600}
.restore-err{margin-top:12px;padding:11px 13px;border-radius:10px;background:color-mix(in srgb,var(--alert) 12%,transparent);color:var(--ink);font-size:14px;line-height:1.45;border:1px solid color-mix(in srgb,var(--alert) 35%,transparent)}
.restore-paste{margin-top:18px}
.restore-paste summary{min-height:44px;display:flex;align-items:center;cursor:pointer;font-size:14px;color:var(--ink-2);font-weight:500}
.restore-paste textarea{margin-top:4px}
.undo-card{display:flex;align-items:center;gap:12px;padding:11px 14px;margin-top:11px}
.undo-card .name{font-weight:500}
.undo-card .meta{font-size:13px;color:var(--ink-3);margin-top:2px}
.busy{display:flex;align-items:center;gap:12px;padding:18px 2px;color:var(--ink-2);font-size:14px}
.spin{width:20px;height:20px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite;flex:0 0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
.btn.dangerfill:hover{filter:brightness(1.08)}

/* ---- catalog toolbar + filter ---- */
.toolbar{display:flex;gap:9px;align-items:stretch}
.toolbar .inp{flex:1 1 auto;min-width:0}
.filterbtn{flex:0 0 auto;min-height:48px;padding:0 14px;gap:7px;position:relative}
.filterbtn svg{width:17px;height:17px}
.filterbtn.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line)}
.fbadge{
  display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:10px;
  background:var(--accent);color:var(--accent-ink);font-size:11.5px;font-weight:600;
}
.catcount{font-size:12.5px;color:var(--ink-3);margin:10px 2px 0}
.chip.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line);font-weight:600}
.chip.ghost{border-style:dashed;color:var(--ink-3);background:transparent}
.chip svg.cx{width:13px;height:13px;margin-left:6px;opacity:.75}
.chip svg.cstar{width:14px;height:14px;margin-right:6px}
.chip .cn{margin-left:7px;font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.chip.on .cn{display:none}
.afchips{flex-wrap:wrap;overflow:visible;margin-inline:0;padding-inline:0}
/* long store/category names wrap inside their chip instead of running off-screen */
.afchips .chip,.fchips .chip{white-space:normal;max-width:100%;text-align:left;line-height:1.3;padding-block:8px;overflow-wrap:anywhere}
.fgroup{margin-bottom:18px}
.fgroup .flabel{margin-bottom:8px}
.fchips{display:flex;flex-wrap:wrap;gap:7px}
.chip.zero{opacity:.45}
.sheet-ft .fclear{flex:0 0 auto}
.sheet-ft .fshow{flex:1 1 auto;white-space:nowrap}

/* favourite star */
.favbtn{
  flex:0 0 44px;width:44px;height:44px;border-radius:var(--r-sm);display:grid;place-items:center;
  color:var(--ink-3);transition:color .14s ease;
}
@media (prefers-reduced-motion:reduce){.favbtn{transition:none}}
.favbtn svg{width:21px;height:21px;stroke-width:1.8}
.favbtn:hover{color:var(--ink-3);background:var(--surface-2)}
.favbtn[aria-pressed="true"]{color:var(--star)}
.favbtn[aria-pressed="true"] svg{fill:currentColor}
.favbtn.inhead{color:var(--ink-3)}
.row .favbtn{margin-right:-6px}

/* two-state stock pills used in the quick-mark sheet */
.stockset{display:flex;gap:6px;flex:0 0 auto}
.stockbtn{
  min-height:44px;padding:0 11px;border-radius:10px;
  border:1px solid var(--line-2);background:var(--surface);
  font-family:var(--disp);font-weight:600;font-size:12.5px;letter-spacing:.02em;
  color:var(--ink-3);display:inline-flex;align-items:center;justify-content:center;
}
.stockbtn:hover{border-color:var(--ink-3);color:var(--ink-2)}
.stockbtn.low[aria-pressed="true"]{background:var(--warn-soft);border-color:var(--warn-line);color:var(--warn)}
.stockbtn.need[aria-pressed="true"]{background:var(--alert-soft);border-color:var(--alert);color:var(--alert)}
.markrow .body{min-width:0}

/* group header doubles as the collapse control for its category */
.grouphd{
  display:flex;align-items:center;gap:8px;padding:12px 2px 8px;flex-wrap:wrap;row-gap:4px;
  width:100%;min-height:44px;background:none;border:none;border-radius:10px;
}
.grouphd:hover h3{color:var(--ink)}
.grouphd .car{width:13px;height:13px;flex:0 0 13px;color:var(--ink-3);transition:transform .16s ease}
.grouphd[aria-expanded="true"] .car{transform:rotate(90deg)}
@media (prefers-reduced-motion:reduce){.grouphd .car{transition:none}}
.sheet-bd .grouphd:first-child{padding-top:2px}
.grouphd h3{
  font-family:var(--disp);font-weight:700;font-size:12px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-2);margin:0;
  flex:1 1 auto;min-width:0;overflow-wrap:anywhere;
}
.grouphd .n{font-family:var(--mono);font-size:11px;color:var(--ink-3);flex:0 0 auto;white-space:nowrap}
.grouphd .rule{flex:1 1 10px;min-width:6px;height:1px;background:var(--line)}

/* ---------- totals bar ---------- */
.bar{
  position:fixed;left:0;right:0;bottom:0;z-index:35;
  padding-bottom:var(--nav-h,76px);
  background:color-mix(in srgb,var(--surface) 94%,transparent);
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line-2);box-shadow:0 -6px 20px rgba(20,32,27,.07);
}
.bar .wrap{padding-block:11px 11px}
.bar .grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}
.bar .cell .k{font-family:var(--disp);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.bar .cell .v{font-family:var(--mono);font-size:15px;font-weight:500;letter-spacing:-.02em}
.bar .cell.big .v{font-size:22px;font-weight:700;letter-spacing:-.02em}
.bar .cell.big .k{color:var(--ink-2)}
.bar .cell.acc .v{color:var(--accent)}
.bar .miss{
  grid-column:1/-1;font-size:12px;color:var(--warn);font-weight:500;
  display:flex;align-items:center;gap:5px;margin-top:1px;
}
.bar .miss svg{width:13px;height:13px;flex:0 0 13px}
.bar .fin{grid-column:1/-1;margin-top:9px}

/* ---------- sheet ---------- */
.scrim{
  position:fixed;inset:0;z-index:60;background:rgba(12,20,16,.42);
  display:flex;align-items:flex-end;justify-content:center;
  animation:fade .16s ease;
}
/* layers below the top one: dim the parent sheet a little, don't re-dim the page */
.scrim.under{background:transparent;animation:none}
.scrim.under + .scrim{background:rgba(12,20,16,.3)}
.scrim.under .sheet{animation:none;pointer-events:none}
/* an empty drill-down shouldn't read as a broken fragment */
.empty.roomy{padding-block:44px}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{transform:translateY(16px)}}
.sheet{
  width:100%;max-width:560px;max-height:min(92dvh,92vh,820px);
  background:var(--ground);border-radius:20px 20px 0 0;
  display:flex;flex-direction:column;overflow:hidden;
  box-shadow:var(--shadow-2);animation:rise .2s cubic-bezier(.2,.8,.3,1);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-reduced-motion:reduce){.scrim,.sheet{animation:none}}
.sheet-hd{
  display:flex;align-items:center;gap:10px;padding:14px 16px 12px;
  border-bottom:1px solid var(--line);background:var(--surface);
}
.sheet-hd h2{font-family:var(--disp);font-weight:700;font-size:17px;margin:0;flex:1;letter-spacing:-.01em;line-height:1.25}
.sheet-hd .sub{font-size:12px;color:var(--ink-3);font-family:var(--sans);font-weight:400;letter-spacing:0;text-transform:none;display:block;margin-top:1px}
.sheet-bd{overflow-y:auto;overscroll-behavior:contain;padding:var(--gap-3);flex:1;-webkit-overflow-scrolling:touch}
/* stacks to full-width buttons when two won't fit side by side */
.sheet-ft{padding:12px 16px;border-top:1px solid var(--line);background:var(--surface);display:flex;gap:9px;flex-wrap:wrap}
.sheet-ft>*{flex:1 1 148px}

/* ---------- forms ---------- */
.field{margin-bottom:14px}
.field>label,.flabel{
  display:block;font-family:var(--disp);font-size:11px;font-weight:600;
  letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px;
}
/* 16px keeps iOS from zooming the viewport when a field takes focus */
.inp,select.inp,textarea.inp{
  width:100%;min-height:48px;padding:12px 14px;border-radius:var(--r-sm);
  border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-size:16px;
}
textarea.inp{min-height:76px;resize:vertical;line-height:1.5}
.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.inp.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);background-position:calc(100% - 17px) 20px,calc(100% - 12px) 20px;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:34px}
/* collapses to one column when two columns can't hold their content */
.pair{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.pair>*{min-width:0}
.hint{font-size:12px;color:var(--ink-3);margin-top:5px;line-height:1.45}
.pre{
  display:flex;align-items:center;border:1px solid var(--line-2);border-radius:var(--r-sm);
  background:var(--surface);overflow:hidden;
}
.pre:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.pre .sym{padding:0 2px 0 13px;color:var(--ink-3);font-size:15px;flex:0 0 auto}
.pre .suf{padding:0 12px 0 4px;color:var(--ink-3);font-size:12.5px;white-space:nowrap;flex:0 1 auto;overflow:hidden;text-overflow:ellipsis}
.pre input{flex:1 1 40px;min-width:0;width:100%;border:none;background:transparent;padding:13px 6px;font-family:var(--mono);font-size:16px;font-variant-numeric:tabular-nums}
.pre input:focus{outline:none}


.disclose{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden;margin-top:16px}
.disclose>summary{
  padding:13px;font-family:var(--disp);font-weight:600;font-size:13px;letter-spacing:.05em;
  text-transform:uppercase;color:var(--ink-2);cursor:pointer;list-style:none;
  display:flex;align-items:center;gap:8px;min-height:48px;
}
.disclose>summary::-webkit-details-marker{display:none}
.disclose>summary .car{width:15px;height:15px;transition:transform .16s;color:var(--ink-3);flex:0 0 15px}
.disclose>summary .lead{width:16px;height:16px;flex:0 0 16px;color:var(--accent)}
@media (prefers-reduced-motion:reduce){.disclose>summary .car{transition:none}}
.disclose[open]>summary .car{transform:rotate(90deg)}
.disclose>summary .n{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--ink-3);text-transform:none;letter-spacing:0}
.disclose .inner{border-top:1px solid var(--line)}

.kv{display:flex;justify-content:space-between;gap:14px;padding:9px 0;font-size:14px;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--ink-3)}
.kv .v{font-family:var(--mono);font-weight:500;text-align:right}

.ph-store{margin-bottom:14px}
.ph-store .hd{display:flex;align-items:center;gap:7px;margin-bottom:5px}
.ph-store .hd b{font-family:var(--disp);font-size:13px;font-weight:700}
.ph-store .hd .rule{flex:1;height:1px;background:var(--line)}

.selrow{display:flex;align-items:center;gap:4px;padding:8px 11px;min-height:60px}
.selrow .cb{flex:0 0 44px;width:44px;height:44px;display:grid;place-items:center}
.selrow .cb .box{
  width:24px;height:24px;border-radius:7px;border:2px solid var(--line-2);
  display:grid;place-items:center;color:transparent;background:var(--surface);
}
.selrow .cb .box svg{width:14px;height:14px;stroke-width:3}
.selrow .cb[aria-checked="true"] .box{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.selrow .price{padding-left:6px}
/* meta data points separated by space, not orphan-prone interpuncts */
.selrow .meta{gap:4px 10px}
.selrow .meta .mi.num{white-space:nowrap}
.selrow .meta .mi{overflow-wrap:anywhere;min-width:0}
.row .meta{gap:4px 9px}
.row .meta .mi{white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.li .subwrap .mi{white-space:nowrap;display:inline-flex;align-items:center;gap:6px}

.toast{
  position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));
  transform:translateX(-50%);z-index:80;
  background:var(--ink);color:var(--ground);
  padding:11px 17px;border-radius:11px;font-size:13.5px;font-weight:500;
  box-shadow:var(--shadow-2);max-width:min(92vw,420px);
  display:flex;align-items:center;gap:8px;text-align:left;
  animation:rise .18s ease;
}
.toast svg{width:16px;height:16px;flex:0 0 16px;stroke-width:3}
.toast.ok svg{color:var(--accent)}
:root[data-theme="dark"] .toast.ok svg,
:root:not([data-theme="light"]) .toast.ok svg{color:var(--accent)}
/* brief highlight on the row that was just added */
@keyframes flashrow{from{background:var(--accent-soft)}to{background:transparent}}
@keyframes leaverow{to{opacity:0;transform:translateX(14px)}}
.li.leaving{animation:leaverow .17s ease-in forwards;pointer-events:none}
@media (prefers-reduced-motion:reduce){.li.leaving{animation:none;opacity:.5}}
.row.flash{animation:flashrow 1.1s ease-out}
@media (prefers-reduced-motion:reduce){.row.flash{animation:none}}
.banner{
  display:flex;gap:9px;align-items:flex-start;
  background:var(--warn-soft);border:1px solid var(--warn-line);color:var(--warn);
  padding:12px 14px;border-radius:var(--r-sm);font-size:13px;line-height:1.45;margin-bottom:16px;
}
.banner svg{width:16px;height:16px;flex:0 0 16px;margin-top:1px}
.skel{height:64px;border-radius:var(--r);background:var(--surface-2);margin-bottom:9px;opacity:.7}
/* ============ WIDE SCREENS (iPad, laptop) — phones never reach these ============ */
@media (min-width:740px){
  :root{--rail:96px}
  body{padding-left:var(--rail)}
  .wrap{max-width:1180px;padding-inline:clamp(20px,3vw,32px)}
  /* bottom tabs become a side rail */
  nav.tabs{top:0;right:auto;width:var(--rail);border-top:none;border-right:1px solid var(--line);
    padding-bottom:0;padding-top:env(safe-area-inset-top,0px)}
  nav.tabs .wrap{display:flex;flex-direction:column;gap:6px;padding:16px 10px;max-width:none}
  .tab{min-height:66px;position:relative}
  .tab .badge{top:8px;right:16px;transform:none}
  .bar{left:var(--rail)}
  .toast{bottom:calc(24px + var(--bar-h,0px))}
  /* Home: summary and quick actions on the left, Still Needed and Running Low on the right */
  .home-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 var(--gap-4);align-items:start}
  /* Catalog: category groups flow into columns */
  .groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,284px),1fr));gap:0 var(--gap-3);align-items:start}
  .narrow{max-width:760px}
  /* totals: four figures across, Finish Trip beneath */
  .bar .grid{grid-template-columns:repeat(4,minmax(0,1fr));align-items:end;gap:6px 20px}
  .bar .cell.big{grid-column:auto!important}
  .bar .miss{grid-column:1/-1}
  /* sheets open as centred dialogs rather than rising from the bottom */
  .scrim{align-items:center;padding:24px}
  .sheet{border-radius:20px;max-height:min(86vh,820px)}
}
@media (min-width:1000px){
  /* totals and Finish Trip in a single row */
  .bar .grid{grid-template-columns:repeat(4,minmax(0,1fr)) minmax(180px,auto)}
  .bar .fin{grid-column:-2/-1;grid-row:1;margin-top:0;align-self:center}
  /* Shopping List with the catalog beside it */
  .split{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,390px);gap:var(--gap-4);align-items:start}
  .split .addmore{display:none}
  .split-side{position:sticky;top:calc(var(--appbar-h,72px) + 14px);margin-top:14px;
    max-height:calc(100vh - var(--appbar-h,72px) - var(--bar-h,0px) - 44px);
    display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);
    border-radius:var(--r);overflow:hidden}
  .panel-hd{padding:14px 14px 12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
  .panel-title{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;color:var(--ink)}
  .panel-title svg{width:17px;height:17px;color:var(--accent)}
  .panel-bd{overflow-y:auto;overscroll-behavior:contain;padding:2px 12px 14px;flex:1}
  .panel-bd .card{background:var(--surface-3)}
}
@media (min-width:740px) and (prefers-reduced-motion:reduce){ .sheet{animation:none} }

/* one type family, but figures still line up in columns */
.kv .v,.row .price,.li .tot,.bar .cell .v,.pricebtn,.grouphd .n,.trip-card .total,
.wtin input,.tab .badge,.sec-head .count,.fbadge,.cmp td,.pre input,.ph-store .kv .v{
  font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;
}
</style>
</head>
<body>
<div class="appbar"><div class="wrap" id="appbar"></div></div>
<main id="screens"><div class="wrap" id="screen"></div></main>
<div id="barhost"></div>
<nav class="tabs"><div class="wrap" id="tabs"></div></nav>
<div id="sheets"></div>
<div id="toasts"></div>

<script>
"use strict";
/* ============================================================
   Pantry Run — personal grocery manager
   Domain objects kept separate: categories, stores, products,
   shopping list, list items, purchase history, price history.
   ============================================================ */

/* ---------------- icons ---------------- */
const I = {

  book:'<path d="M4 4.5A1.5 1.5 0 0 1 5.5 3H19v18H5.5A1.5 1.5 0 0 1 4 19.5z"/><path d="M8 3v18"/><path d="M11.5 8.5h4"/><path d="M11.5 12h4"/>',
  cart:'<circle cx="9.5" cy="19.5" r="1.4"/><circle cx="17.5" cy="19.5" r="1.4"/><path d="M2.5 3.5h2.6l2.4 11.2h10.6l2-7.7H6.2"/>',
  clock:'<circle cx="12" cy="12" r="8.6"/><path d="M12 7v5.3l3.4 2"/>',
  plus:'<path d="M12 5v14"/><path d="M5 12h14"/>',
  minus:'<path d="M5 12h14"/>',
  check:'<path d="M4.5 12.5 9.5 17.5 19.5 6.5"/>',
  trash:'<path d="M4 6.5h16"/><path d="M9 6.5V4.5h6v2"/><path d="M6.5 6.5 7.5 20h9l1-13.5"/>',
  x:'<path d="M6 6l12 12"/><path d="M18 6 6 18"/>',
  gear:'<path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.3"/><circle cx="10" cy="17" r="2.3"/>',
  back:'<path d="M15 4.5 7.5 12l7.5 7.5"/>',
  car:'<path d="M9 5.5 15.5 12 9 18.5"/>',
  alert:'<path d="M12 3.5 22 20H2z"/><path d="M12 9.5v4.2"/><path d="M12 16.8v.2"/>',
  store:'<path d="M4 9.5h16V20H4z"/><path d="M3 9.5 5 4h14l2 5.5"/><path d="M9.5 20v-5h5v5"/>',
  tag:'<path d="M3.5 11.5V3.5h8l9 9-8 8z"/><circle cx="8" cy="8" r="1.3"/>',
  edit:'<path d="M4 20h4l10-10-4-4L4 16z"/><path d="M13.5 6.5 17.5 10.5"/>',

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* Currency only changes how amounts are shown — nothing is converted. */
const CURRENCIES = [
  ['CAD', 'Canadian dollar'], ['USD', 'US dollar'], ['EUR', 'Euro'], ['GBP', 'British pound'],
  ['AUD', 'Australian dollar'], ['NZD', 'New Zealand dollar'], ['MXN', 'Mexican peso'],
  ['INR', 'Indian rupee'], ['JPY', 'Japanese yen'], ['CHF', 'Swiss franc']

const DEFAULT_CURRENCY = 'CAD';
const moneyFmt = new Map();
function currencyCode() {
  const c = S && S.settings && S.settings.currency;
  return CURRENCIES.some(x => x[0] === c) ? c : DEFAULT_CURRENCY;
}
function fmtFor(code) {
  if (!moneyFmt.has(code)) {
    let f;
    try { f = new Intl.NumberFormat(undefined, { style: 'currency', currency: code, currencyDisplay: 'narrowSymbol' }); }
    catch (e) { f = new Intl.NumberFormat(undefined, { style: 'currency', currency: code }); }
    moneyFmt.set(code, f);
  }
  return moneyFmt.get(code);
}
const money = n => (n == null || !isFinite(n)) ? '—' : fmtFor(currencyCode()).format(Number(n));
/* the bare symbol, for the prefix inside price fields */
function currencySymbol(code) {
  const part = fmtFor(code || currencyCode()).formatToParts(0).find(x => x.type === 'currency');
  return part ? part.value : '$';
}
const WEIGHT_UNITS = ['lb', 'kg'];
const defaultWeightUnit = () => WEIGHT_UNITS.includes(S.settings.weightUnit) ? S.settings.weightUnit : 'lb';
const numfmt = n => { const v = Number(n); return Number.isInteger(v) ? String(v) : String(parseFloat(v.toFixed(3))); };
const todayISO = () => new Date().toISOString();
const clone = o => (o == null ? o : JSON.parse(JSON.stringify(o)));

function fmtDate(iso, long) {
  if (!iso) return '—';
  const d = new Date(iso);
  if (isNaN(d)) return '—';
  return d.toLocaleDateString(undefined, long
    ? { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' }

}
function relDate(iso) {
  if (!iso) return 'never';
  const days = Math.floor((Date.now() - new Date(iso)) / 86400000);
  if (days <= 0) return 'today';
  if (days === 1) return 'yesterday';
  if (days < 30) return days + ' days ago';
  const m = Math.round(days / 30);

/* ---------------- persistence ---------------- */
const LS_KEY = 'pantryrun.v1';
let DB = null, backend = 'memory';

const localBlob = () => {
  try { return JSON.parse(localStorage.getItem(LS_KEY) || '{}'); } catch (e) { return {}; }
};
const localSave = obj => {
  try { localStorage.setItem(LS_KEY, JSON.stringify(obj)); } catch (e) { /* storage blocked */ }
};
const snapshotLocal = () => ({
  products: S.products, stores: S.stores, categories: S.categories,
  settings: S.settings, active: S.active, trips: S.trips
});

const queues = new Map();
function enqueue(path, fn) {
  const prev = queues.get(path) || Promise.resolve();
  const next = prev.catch(() => {}).then(fn).catch(err => {
    console.error('save failed', path, err);
    toast('Couldn’t save that change.');
  });
  queues.set(path, next);
  return next;
}

const Persist = {
  saveProduct(p) {
    if (backend === 'db') return enqueue('products/' + p.id, () => DB.doc('products/' + p.id).set(p));
    localSave(snapshotLocal());
  },
  deleteProduct(id) {
    if (backend === 'db') return enqueue('products/' + id, () => DB.doc('products/' + id).delete());
    localSave(snapshotLocal());
  },
  saveMeta(key) {
    if (backend === 'db') {
      const body = key === 'settings' ? S.settings
        : key === 'stores' ? { items: S.stores } : { items: S.categories };
      return enqueue('meta/' + key, () => DB.doc('meta/' + key).set(body));
    }
    localSave(snapshotLocal());
  },
  saveActive() {
    if (backend === 'db') {
      return enqueue('lists/active', () => S.active
        ? DB.doc('lists/active').set(S.active)
        : DB.doc('lists/active').delete());
    }
    localSave(snapshotLocal());
  },
  saveTrip(t) {
    if (backend === 'db') return enqueue('trips/' + t.id, () => DB.doc('trips/' + t.id).set(t));
    localSave(snapshotLocal());
  },
  deleteTrip(id) {
    if (backend === 'db') return enqueue('trips/' + id, () => DB.doc('trips/' + id).delete());
    localSave(snapshotLocal());
  }
};

async function boot() {
  let db = null;
  try { db = await window.claude?.use?.('db'); } catch (e) { db = null; }
  if (db) {
    DB = db; backend = 'db';
    try {
      const [prods, stores, cats, sets, act, trips] = await Promise.all([
        db.collection('products').limit(1000).get(),
        db.doc('meta/stores').get(),
        db.doc('meta/categories').get(),
        db.doc('meta/settings').get(),
        db.doc('lists/active').get(),
        db.collection('trips').orderBy('date', 'desc').limit(200).get()
      ]);
      /* Documents from the store are frozen and shared across reads —
         mutating one throws. Everything the app edits must be its own copy. */
      S.products = prods.docs.map(d => clone(d.data()));
      S.stores = stores.exists ? clone(stores.data().items || []) : [];
      S.categories = cats.exists ? clone(cats.data().items || []) : [];
      S.settings = Object.assign({ taxRate: 13, id: 'app' }, sets.exists ? clone(sets.data()) : {});
      S.active = act.exists ? clone(act.data()) : null;
      S.trips = trips.docs.map(d => clone(d.data()));
    } catch (e) {
      console.error(e);
      backend = 'local';
      S.storageNote = 'Cloud storage didn’t respond — this device is saving locally for now.';
    }
  } else {
    backend = 'local';
  }
  if (backend === 'local') {
    const b = localBlob();
    S.products = b.products || []; S.stores = b.stores || []; S.categories = b.categories || [];
    S.settings = Object.assign({ taxRate: 13, id: 'app' }, b.settings || {});
    S.active = b.active || null; S.trips = b.trips || [];
  }
  if (!S.categories.length) {
    S.categories = DEFAULT_CATEGORIES.map((n, i) => ({ id: uid('cat'), name: n, order: i }));
    Persist.saveMeta('categories');
  }
  S.products.sort((a, b) => a.name.localeCompare(b.name));
  S.trips.sort((a, b) => String(b.date).localeCompare(String(a.date)));
  await bootSafety();
  S.ready = true;
  render();
}

/* ---------------- domain: pricing ---------------- */
function latestStorePrice(product, storeId) {
  if (!product || !storeId) return null;
  const hits = (product.priceHistory || []).filter(h => h.storeId === storeId && h.price != null);
  if (!hits.length) return null;
  hits.sort((a, b) => String(b.date).localeCompare(String(a.date)));
  return hits[0].price;
}
function expectedPriceFor(product, storeId) {
  if (!product) return null;
  const sp = latestStorePrice(product, storeId);
  return sp != null ? sp : (product.usualPrice != null ? product.usualPrice : null);
}
const effectiveUnitPrice = it => (it.actualPrice != null ? it.actualPrice : (it.expectedPrice != null ? it.expectedPrice : null));
const itemAmount = it => (it.unitType === 'weight' ? (it.weight != null ? it.weight : 0) : (it.qty != null ? it.qty : 0));
function itemTotal(it) {
  const p = effectiveUnitPrice(it);
  return p == null ? null : p * itemAmount(it);
}
function computeTotals(list) {
  const t = { purchased: 0, remaining: 0, subtotal: 0, tax: 0, total: 0, missing: 0, checked: 0, open: 0 };
  if (!list) return t;
  for (const it of list.items) {
    if (it.checked) t.checked++; else t.open++;
    const amt = itemTotal(it);
    if (amt == null) { t.missing++; continue; }
    if (it.checked) t.purchased += amt; else t.remaining += amt;
  }
  t.subtotal = t.purchased + t.remaining;
  /* Ontario: sales tax applies to the whole grocery subtotal */
  t.tax = t.subtotal * ((Number(S.settings.taxRate) || 0) / 100);
  t.total = t.subtotal + t.tax;
  return t;
}

/* ---------------- domain: mutations ---------------- */
function ensureActive() {
  if (!S.active) {
    S.active = { id: uid('list'), createdAt: todayISO(), items: [] };
    Persist.saveActive();
  }
  return S.active;
}
function makeListItem(product, overrides) {
  const storeId = (overrides && overrides.storeId !== undefined) ? overrides.storeId : (product.preferredStoreId || null);
  const it = {
    id: uid('li'), productId: product.id, name: product.name,
    categoryId: product.categoryId || null, storeId,
    unitType: product.unitType || 'unit', weightUnit: product.weightUnit || 'lb',
    qty: product.defaultQty || 1,
    weight: product.unitType === 'weight' ? (product.defaultWeight || 1) : null,
    expectedPrice: expectedPriceFor(product, storeId),
    actualPrice: null, checked: false, checkedAt: null
  };
  if (overrides) Object.assign(it, overrides);
  return it;
}
function addProductToList(productId, overrides) {
  const p = productById(productId);
  if (!p) return null;
  const list = ensureActive();
  const existing = list.items.find(i => i.productId === productId && !i.checked);
  if (existing) {
    if (existing.unitType === 'weight') return { item: existing, note: p.name + ' is already on the list' };
    existing.qty = (existing.qty || 1) + (p.defaultQty || 1);
    Persist.saveActive();
    return { item: existing, note: p.name + ' → qty ' + numfmt(existing.qty) };
  }
  const it = makeListItem(p, overrides);
  list.items.push(it);
  Persist.saveActive();
  return { item: it, note: p.name + ' added to list' };
}
/* Category belongs to the product, so setting it from a list row updates the
   catalog too — otherwise it would revert the next time the item is added. */
function setItemCategory(it, categoryId) {
  it.categoryId = categoryId;
  Persist.saveActive();
  const p = productById(it.productId);
  if (p && p.categoryId !== categoryId) {
    p.categoryId = categoryId;
    saveProduct(p);
  }
}

/* Undo an add: drop the still-unbought list item for this product. */
function removeProductFromList(productId) {
  if (!S.active) return false;
  const i = S.active.items.findIndex(x => x.productId === productId && !x.checked);
  if (i < 0) return false;
  S.active.items.splice(i, 1);
  Persist.saveActive();
  return true;
}
function removeListItem(itemId) {
  if (!S.active) return;
  S.active.items = S.active.items.filter(i => i.id !== itemId);
  Persist.saveActive();
}
const findItem = id => S.active ? S.active.items.find(i => i.id === id) : null;

function saveProduct(p) {
  delete p.taxable;           /* retired: tax now applies to the whole subtotal */
  const i = S.products.findIndex(x => x.id === p.id);
  if (i >= 0) S.products[i] = p; else S.products.push(p);
  S.products.sort((a, b) => a.name.localeCompare(b.name));
  Persist.saveProduct(p);
}
function blankProduct() {
  return {
    id: uid('p'), name: '', categoryId: activeCategories()[0] ? activeCategories()[0].id : null,
    unitType: 'unit', usualPrice: null, weightUnit: defaultWeightUnit(),
    defaultQty: 1, defaultWeight: 1,
    packageSize: '', preferredStoreId: null, notes: '', shelfLife: '',
    frequency: '', customFrequency: '', stock: 'in',
    lastPurchased: null, typicalQty: null, lastStoreId: null, priceHistory: []
  };
}
/* Adding a name that matches something archived brings the original back,
   rather than making a second one that shares none of its history. */
function addStore(name) {
  const clean = String(name || '').trim();
  if (!clean) return null;
  const existing = S.stores.find(s => s.name.toLowerCase() === clean.toLowerCase());
  if (existing) {
    if (existing.archived) { delete existing.archived; Persist.saveMeta('stores'); return { rec: existing, restored: true }; }
    return { rec: existing, duplicate: true };
  }
  const s = { id: uid('st'), name: clean };
  S.stores.push(s);
  Persist.saveMeta('stores');
  return { rec: s };
}
function addCategory(name) {
  const clean = String(name || '').trim();
  if (!clean) return null;
  const existing = S.categories.find(c => c.name.toLowerCase() === clean.toLowerCase());
  if (existing) {
    if (existing.archived) { delete existing.archived; Persist.saveMeta('categories'); return { rec: existing, restored: true }; }
    return { rec: existing, duplicate: true };
  }
  const c = { id: uid('cat'), name: clean, order: S.categories.length };
  S.categories.push(c);
  Persist.saveMeta('categories');
  return { rec: c };
}

/* Still Needed = unpurchased items from the most recent completed trip. */
function stillNeeded() {
  const t = S.trips[0];
  if (!t) return [];
  return (t.items || []).filter(i => !i.checked);
}

    document.getElementById('barhost').innerHTML = '';

  }
  /* the catalog panel beside the list keeps its scroll and typing focus across redraws */
  const keep = [...el.querySelectorAll('[data-keep]')].map(x => [x.dataset.keep, x.scrollTop]);
  const focusId = document.activeElement && el.contains(document.activeElement) ? document.activeElement.id : null;
  const caret = focusId && document.activeElement.selectionStart != null ? document.activeElement.selectionStart : null;
  el.innerHTML = view === 'home' ? viewHome()

  keep.forEach(([k, top]) => { const x = el.querySelector(`[data-keep="${k}"]`); if (x) x.scrollTop = top; });
  if (focusId === 'pickq-side') {

          <div class="k">Expected total</div>
          <div class="total">${money(t.total)}</div>
        </div>
      </div>
      ${t.missing ? `<div class="miss">${svg('alert')}${t.missing} ${t.missing === 1 ? 'item is' : 'items are'} missing a price</div>` : ''}
      <button class="btn primary block" data-act="go" data-v="list">${svg('cart')}Continue Shopping List</button>
    </div>`;
  } else {
    h += `<div class="trip-card">
      <div class="line"><div>
        <div class="k">Current list</div>
        <div class="items">No shopping list yet.</div>
        <div class="k" style="margin-top:4px;letter-spacing:.04em;text-transform:none;font-family:var(--sans);font-size:12px">Build one from your catalog</div>
      </div></div>
      <button class="btn primary block" data-act="start-list">${svg('plus')}Start New List</button>
    </div>`;
  }
  /* second action on Home, right under the list card */
  if (S.products.length) {
    h += `<button class="btn action block" data-act="mark-stock" style="margin-top:12px">${svg('tag')}Mark items low or needed</button>`;
  }
  h += '</div>';

  const homeTop = h; h = '';
  /* Still Needed — like Running Low, an item drops off once it's on the list */
  const outstanding = stillNeeded();
  const sn = outstanding.filter(i => !onActiveList(i.productId));
  h += `<div class="sec">
    <div class="sec-head"><h2>Still Needed</h2><span class="count num">${sn.length}</span></div>`;
  if (sn.length) {
    h += `<div class="sec-note">Left unbought on your ${fmtDate(S.trips[0].date)} trip. Adding one takes it off this list.</div>
      <div class="card stack">${sn.map(i => quickRow(i.productId, i.name, catName(i.categoryId))).join('')}</div>`;
  } else if (outstanding.length) {
    h += `<div class="empty">
      <strong>All caught up</strong>
      ${outstanding.length === 1 ? 'The item you didn’t buy last trip is' : `All ${outstanding.length} items you didn’t buy last trip are`} already on your shopping list.
    </div>`;
  } else if (S.trips.length) {
    h += `<div class="empty">${svg('check', 'eicon')}You bought everything from your last trip.</div>`;
  } else {
    h += `<div class="empty">Items you leave unchecked when you finish a trip show up here.</div>`;
  }
  h += '</div>';

  /* Running Low / Need to Buy */
  /* once it's on the shopping list it's handled, so it drops off this list;
     take it back off the list and it reappears here */
  const marked = S.products.filter(p => p.stock === 'low' || p.stock === 'need');
  const low = marked.filter(p => !onActiveList(p.id))
    .sort((a, b) => (a.stock === 'need' ? 0 : 1) - (b.stock === 'need' ? 0 : 1) || a.name.localeCompare(b.name));
  h += `<div class="sec">
    <div class="sec-head"><h2>Running Low</h2><span class="count num">${low.length}</span></div>`;
  if (low.length) {
    h += `<div class="sec-note">Marked by you. Adding one takes it off this list.</div>
      <div class="card stack">${low.map(p => quickRow(p.id, p.name, catName(p.categoryId),
        p.stock === 'need' ? '<span class="pill need">Need to buy</span>' : '<span class="pill low">Running low</span>')).join('')}</div>`;
  } else if (marked.length) {
    h += `<div class="empty">
      <strong>All caught up</strong>
      ${marked.length === 1 ? 'The item you marked is' : `All ${marked.length} items you marked are`} already on your shopping list.
    </div>`;
  } else {
    h += `<div class="empty">${svg('tag', 'eicon')}Nothing marked low right now.</div>`;
  }
  h += '</div>';
  return `<div class="home-grid"><div class="home-a">${homeTop}</div><div class="home-b">${h}</div></div>`;
}

function quickRow(productId, name, category, pillHtml) {
  const p = productById(productId);
  const price = p ? expectedPriceFor(p, p.preferredStoreId) : null;
  const gone = !p;
  const inner = `
      <div class="name">${esc(name)}</div>
      <div class="meta">${esc(category)}${pillHtml ? '<span class="mi"><span class="dot">·</span>' + pillHtml + '</span>' : ''}
        ${gone ? '<span class="mi">not in catalog</span>'
               : `<span class="mi num">${price == null ? 'no price' : money(price)}</span>`}
      </div>`;
  return `<div class="row${gone ? '' : ' tappable'}"${gone ? '' : ` data-pid="${p.id}"`}>
    ${gone
      ? `<div class="body">${inner}</div>`
      : `<button class="body" data-act="open-product" data-id="${p.id}" style="min-height:46px"
           aria-label="Open ${esc(name)}">${inner}</button>`}
    ${gone ? '' : listToggleBtn(p)}
  </div>`;
}

function viewCatalog() {

        ${nf ? `<button class="btn" data-act="clear-filters">Clear filters</button>` : ''}
        <button class="btn" data-act="new-product">${svg('plus')}Add New Item</button>
      </div>
    </div></div>`;

/* ---- duplicate detection ----
   Warns, never blocks, never merges. Tuned to catch real near-duplicates
   ("banana" vs "Bananas", "Milk" vs "Whole Milk 2L", "Bannanas" typos)
   while leaving genuinely different versions alone ("Chicken Breast" vs
   "Chicken Thighs", "Greek Yogurt 750g" vs "Greek Yogurt 500g"). */
const DUP_STOP = new Set(['the', 'a', 'an', 'and', 'of', 'with', 'for']);
/* size / packaging words — never the "main noun" of a product name */
const DUP_PACK = new Set(['dozen', 'pack', 'pk', 'count', 'ct', 'box', 'bag', 'bottle', 'can', 'jar', 'carton',
  'tub', 'family', 'value', 'size', 'bulk', 'large', 'small', 'medium', 'jumbo', 'mini', 'l', 'ml', 'g', 'kg', 'lb', 'oz']);
function dupNorm(s) {
  return String(s || '').toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')      /* café → cafe */
    .replace(/&/g, ' and ')
    .replace(/(\d)\s+(?=[a-z])/g, '$1')                      /* "2 L" → "2l" */
    .replace(/[^a-z0-9]+/g, ' ').trim();
}
function dupSingular(t) {
  if (t.length <= 3 || /\d/.test(t)) return t;
  if (t.endsWith('ies')) return t.slice(0, -3) + 'y';        /* berries → berry */
  if (/(ches|shes|xes|sses|oes)$/.test(t)) return t.slice(0, -2); /* tomatoes → tomato */
  if (t.endsWith('s') && !t.endsWith('ss')) return t.slice(0, -1);
  return t;
}
const dupTokens = s => dupNorm(s).split(' ').filter(t => t && !DUP_STOP.has(t)).map(dupSingular);
function levenshtein(a, b) {
  if (a === b) return 0;
  const m = a.length, n = b.length;
  if (!m) return n; if (!n) return m;
  let prev = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) {
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    }
    prev = cur;
  }
  return prev[n];
}
/* 'same' | 'within' | 'spelling' | null */
function dupReason(a, b) {
  const ta = dupTokens(a), tb = dupTokens(b);
  if (!ta.length || !tb.length) return null;
  const ja = ta.join(' '), jb = tb.join(' ');
  if (ja === jb) return 'same';
  /* every word of one name appears in the other AND it shares the longer
     name's main noun: "Milk" / "Whole Milk 2L" warns, "Apple" / "Apple Juice"
     doesn't. The main noun is the last word that isn't a size or pack word. */
  const sa = new Set(ta), sb = new Set(tb);
  const [small, big, bigList] = sa.size <= sb.size ? [sa, sb, tb] : [sb, sa, ta];
  if ([...small].every(t => big.has(t)) && [...small].some(t => t.length >= 3 && !/^\d/.test(t))) {
    const head = [...bigList].reverse().find(t => !/^\d/.test(t) && !DUP_PACK.has(t));
    if (!head || small.has(head)) return 'within';
  }
  /* a typo — tighter for short names so "Peas" and "Pears" stay separate */
  const L = Math.max(ja.length, jb.length), d = levenshtein(ja, jb);
  const allowed = L <= 4 ? 0 : L <= 7 ? 1 : 2;
  if (d <= allowed && !/\d/.test(ja + jb)) return 'spelling';
  /* same words in the same order with a one-letter slip in a longer word */
  if (ta.length === tb.length && ta.length > 1 &&
      ta.every((t, i) => t === tb[i] || (t.length >= 5 && !/\d/.test(t + tb[i]) && levenshtein(t, tb[i]) <= 1))) return 'spelling';
  return null;
}
const DUP_RANK = { same: 0, spelling: 1, within: 2 };
function findDuplicates(name, excludeId) {
  if (!String(name || '').trim()) return [];
  return S.products
    .filter(p => p.id !== excludeId)
    .map(p => ({ p, why: dupReason(name, p.name) }))
    .filter(x => x.why)
    .sort((x, y) => DUP_RANK[x.why] - DUP_RANK[y.why] || x.p.name.localeCompare(y.p.name))
    .slice(0, 5);
}

function buildDupWarning(name, matches) {
  const one = matches.length === 1 ? matches[0].p : null;
  const where = p => p.categoryId ? catName(p.categoryId) : 'Uncategorized';
  const lead = one
    ? `<b>${esc(one.name)}</b> already exists in <b>${esc(where(one))}</b>.`
    : `<b>${matches.length} similar products</b> are already in your catalog.`;
  const why = { same: 'Same name', spelling: 'Very similar spelling', within: 'Overlapping name' };
  return sheetHead('Possible duplicate', '“' + name + '”') + `
    <div class="sheet-bd">
      <div class="dupnote">${svg('alert')}<div>${lead} Add “${esc(name)}” anyway?</div></div>
      <div class="card stack" style="margin-top:14px">
        ${matches.map(({ p, why: w }) => {
          const price = expectedPriceFor(p, p.preferredStoreId);
          return `<div class="row duprow" data-pid="${p.id}">
            <div class="body">
              <div class="name">${esc(p.name)}</div>
              <div class="meta">
                <span class="mi">${esc(where(p))}</span>
                ${p.preferredStoreId ? `<span class="mi">${esc(storeName(p.preferredStoreId))}</span>` : ''}
                <span class="mi num">${price == null ? 'no price' : money(price) + (p.unitType === 'weight' ? '/' + (p.weightUnit || 'lb') : '')}</span>
              </div>
              <div class="dupwhy">${why[w]}</div>
            </div>
            <button class="btn sm" data-act="dup-open" data-id="${p.id}">Open existing</button>
          </div>`;
        }).join('')}
      </div>
      <div class="hint" style="margin-top:12px">Different brands, sizes or versions are fine as separate products — nothing gets merged.</div>
    </div>
    <div class="sheet-ft">
      <button class="btn" data-act="close">Keep editing</button>
      <button class="btn primary" data-act="dup-add-anyway">Add anyway</button>
    </div>`;
}

/* ---- catalog filtering ---- */
function catalogMatches() {
  const q = ui.catQuery.trim().toLowerCase();
  const f = ui.filters;
  return S.products.filter(p => {
    if (q && !p.name.toLowerCase().includes(q) && !catName(p.categoryId).toLowerCase().includes(q)) return false;
    if (f.cats.size && !f.cats.has(p.categoryId || '_none')) return false;
    if (f.stores.size && !f.stores.has(p.preferredStoreId || '_none')) return false;
    if (f.stock.size && !f.stock.has(p.stock || 'in')) return false;
    if (f.fav && !p.favourite) return false;
    return true;
  });
}
const STOCK_LABEL = { in: 'In stock', low: 'Running low', need: 'Need to buy' };

/* the filters in play, each removable on its own */
function activeFilterChips() {
  const f = ui.filters, chips = [];
  f.cats.forEach(id => chips.push(['cats', id, id === '_none' ? 'Uncategorized' : catName(id)]));
  f.stores.forEach(id => chips.push(['stores', id, id === '_none' ? 'No preferred store' : storeName(id)]));
  f.stock.forEach(v => chips.push(['stock', v, STOCK_LABEL[v]]));
  if (f.fav) chips.push(['fav', '1', 'Favourites']);
  return `<div class="chips afchips" style="margin-top:10px">
    ${chips.map(([g, v, label]) => `<button class="chip on" data-act="drop-filter" data-g="${g}" data-v="${esc(v)}"
        aria-label="Remove filter: ${esc(label)}">${g === 'fav' ? svg('star', 'cstar') : ''}${esc(label)}${svg('x', 'cx')}</button>`).join('')}
    <button class="chip ghost" data-act="clear-filters">Clear all</button>
  </div>`;
}

/* Options offered in the filter sheet. Archived stores and categories only
   appear if a product still points at them, so nothing becomes unfindable. */
function filterOptions() {
  const catsUsed = new Set(S.products.map(p => p.categoryId || '_none'));
  const storesUsed = new Set(S.products.map(p => p.preferredStoreId || '_none'));
  const cats = S.categories.filter(c => !c.archived || catsUsed.has(c.id))
    .map(c => [c.id, c.name + (c.archived ? ' (archived)' : '')]);
  if (catsUsed.has('_none')) cats.push(['_none', 'Uncategorized']);
  const stores = S.stores.filter(s => !s.archived || storesUsed.has(s.id))
    .map(s => [s.id, s.name + (s.archived ? ' (archived)' : '')]);
  if (storesUsed.has('_none')) stores.push(['_none', 'No preferred store']);
  return { cats, stores };
}
function countWith(group, value) {
  /* how many products match if this option were toggled on alongside the rest */
  const saved = ui.filters[group];
  const trial = new Set(saved); trial.add(value);
  ui.filters[group] = trial;
  const n = catalogMatches().length;
  ui.filters[group] = saved;
  return n;
}
function buildFilter() {
  const f = ui.filters, o = filterOptions();
  const chip = (group, value, label) => {
    const on = f[group].has(value);
    const n = on ? null : countWith(group, value);
    return `<button class="chip${on ? ' on' : ''}${n === 0 ? ' zero' : ''}" data-act="toggle-filter" data-g="${group}" data-v="${esc(value)}"
      aria-pressed="${on}">${esc(label)}<span class="cn num">${on ? '' : n}</span></button>`;
  };
  const n = catalogMatches().length;
  return sheetHead('Filter the catalog', filterCount() ? filterCount() + ' active' : 'Nothing selected — showing everything') + `
    <div class="sheet-bd">
      <div class="fgroup">
        <span class="flabel">Favourites</span>
        <div class="fchips">
          <button class="chip${f.fav ? ' on' : ''}" data-act="toggle-filter" data-g="fav" data-v="1" aria-pressed="${f.fav}">
            ${svg('star', 'cstar')}Favourites only<span class="cn num">${f.fav ? '' : S.products.filter(p => p.favourite).length}</span></button>
        </div>
      </div>
      <div class="fgroup">
        <span class="flabel">Stock status</span>
        <div class="fchips">${['in', 'low', 'need'].map(v => chip('stock', v, STOCK_LABEL[v])).join('')}</div>
      </div>
      <div class="fgroup">
        <span class="flabel">Category</span>
        <div class="fchips">${o.cats.map(([id, name]) => chip('cats', id, name)).join('') || '<span class="hint">No categories yet.</span>'}</div>
      </div>
      <div class="fgroup">
        <span class="flabel">Preferred store</span>
        <div class="fchips">${o.stores.map(([id, name]) => chip('stores', id, name)).join('') || '<span class="hint">No stores yet.</span>'}</div>
      </div>
      <div class="hint">Pick several in one group to widen it; picking across groups narrows it down.</div>
    </div>
    <div class="sheet-ft">
      <button class="btn fclear" data-act="clear-filters"${filterCount() ? '' : ' disabled'}>Clear all</button>
      <button class="btn primary fshow" data-act="close">Show ${n} ${n === 1 ? 'product' : 'products'}</button>
    </div>`;
}
function sheetFilter() { showSheet(buildFilter, {}, 'root'); }
function clearFilters() {
  ui.filters.cats.clear(); ui.filters.stores.clear(); ui.filters.stock.clear(); ui.filters.fav = false;
}

/* ---- add-to-catalog menu ---- */
function buildAddMenu() {
  return sheetHead('Add to catalog') + `
    <div class="sheet-bd">
      <div class="card stack">
        <button class="row tappable" data-act="new-product" style="width:100%">
          <span class="addbtn" aria-hidden="true">${svg('plus')}</span>
          <div class="body"><div class="name">New product</div>
          <div class="meta">Something you buy — its price, quantity and store</div></div>
          <span class="iconbtn" style="width:24px;flex:0 0 24px;height:24px;color:var(--ink-3)">${svg('car')}</span>
        </button>
      </div>
      <div class="field" style="margin-top:18px">
        <label for="menu-newcat">New category</label>
        <div style="display:flex;gap:9px">
          <input class="inp" id="menu-newcat" placeholder="e.g. Bakery" autocomplete="off">
          <button class="btn" data-act="menu-add-cat" style="flex:0 0 auto">Add</button>
        </div>
        <div class="hint">Shows up straight away in the catalog, filters and pickers.</div>
      </div>
    </div>`;
}

function catalogRow(p) {
  const price = expectedPriceFor(p, p.preferredStoreId);
  const unit = p.unitType === 'weight' ? '/' + (p.weightUnit || 'lb') : '';
  const qty = p.unitType === 'weight' ? numfmt(p.defaultWeight || 1) + ' ' + (p.weightUnit || 'lb') : '×' + numfmt(p.defaultQty || 1);
  return `<div class="row tappable" data-pid="${p.id}">
    <button class="body" data-act="open-product" data-id="${p.id}" style="min-height:46px">
      <div class="name">${esc(p.name)}</div>
      <div class="meta">
        <span class="mi num">${price == null ? 'No price yet' : money(price) + unit}</span>
        <span class="mi"><span class="dot">·</span><span class="num">${esc(qty)}</span></span>
        ${p.unitType === 'weight' ? '<span class="pill wt">By weight</span>' : ''}
        ${p.stock === 'low' ? '<span class="pill low">Low</span>' : ''}
        ${p.stock === 'need' ? '<span class="pill need">Need</span>' : ''}
      </div>
    </button>
    ${favBtn(p)}
    ${listToggleBtn(p)}
  </div>`;
}
function favBtn(p) {
  return `<button class="favbtn" data-act="toggle-fav" data-id="${p.id}" aria-pressed="${!!p.favourite}"
    aria-label="${p.favourite ? 'Remove ' + esc(p.name) + ' from favourites' : 'Add ' + esc(p.name) + ' to favourites'}"
    title="${p.favourite ? 'Favourite' : 'Add to favourites'}">${svg('star')}</button>`;
}

/* ---------------- SHOPPING LIST ---------------- */
function viewList() {
  const list = S.active;
  if (!list || !list.items.length) {
    return `<div class="sec"><div class="empty">
      ${svg('cart', 'eicon')}
      <strong>${list ? 'This list is empty' : 'No shopping list yet.'}</strong>
      Add products from your Master Catalog to start a trip.
      <div class="btnrow" style="max-width:280px;margin-inline:auto;flex-direction:column">
        <button class="btn primary block" data-act="pick-items">${svg('plus')}Add items from catalog</button>
        <button class="btn block" data-act="go" data-v="catalog">${svg('book')}Browse Master Catalog</button>
      </div>
    </div></div>`;
  }
  const open = list.items.filter(i => !i.checked);
  const done = list.items.filter(i => i.checked);

  let h = `<div class="sec" style="margin-top:14px">
    <div class="seg" role="group" aria-label="Group items by">
      <button data-act="group" data-v="store" aria-pressed="${ui.listGroup === 'store'}">By Store</button>
      <button data-act="group" data-v="category" aria-pressed="${ui.listGroup === 'category'}">By Category</button>
    </div>
  </div>`;

  if (!open.length) {
    h += `<div class="sec"><div class="empty">
      <strong>Everything is checked off</strong>
      ${done.length} ${done.length === 1 ? 'item' : 'items'} in the cart. Finish the trip to file it in History.
    </div></div>`;
  } else {
    const groups = new Map();
    for (const it of open) {
      const k = ui.listGroup === 'store' ? (it.storeId || '_un') : (it.categoryId || '_none');
      if (!groups.has(k)) groups.set(k, []);
      groups.get(k).push(it);
    }
    const order = ui.listGroup === 'store'
      ? S.stores.map(s => s.id).concat(['_un'])
      : S.categories.map(c => c.id).concat(['_none']);
    const keys = [...groups.keys()].sort((a, b) => order.indexOf(a) - order.indexOf(b));
    for (const k of keys) {
      const arr = groups.get(k);
      const label = ui.listGroup === 'store'
        ? (k === '_un' ? 'Unassigned' : storeName(k))
        : (k === '_none' ? 'Uncategorized' : catName(k));
      const sum = arr.reduce((a, it) => { const t = itemTotal(it); return t == null ? a : a + t; }, 0);
      h += `<div class="sec" style="margin-top:14px">
        ${groupHead('list', ui.listGroup + ':' + k, label, arr.length, `<span class="n">${money(sum)}</span>`)}
        ${isCollapsed('list', ui.listGroup + ':' + k) ? '' : `<div class="card stack">${arr.map(listItemRow).join('')}</div>`}
      </div>`;
    }
  }

  h += `<div class="sec addmore"><button class="btn block" data-act="pick-items">${svg('plus')}Add items from catalog</button></div>`;

  if (done.length) {
    h += `<details class="disclose" ${ui.showDone ? 'open' : ''} data-act="toggle-done">

      <div class="inner stack">${done.map(listItemRow).join('')}</div>
    </details>`;
  }
  return h;
}

function listItemRow(it) {
  const p = productById(it.productId);
  const unitPrice = effectiveUnitPrice(it);
  const total = itemTotal(it);
  const isActual = it.actualPrice != null;
  const perUnit = it.unitType === 'weight' ? '/' + (it.weightUnit || 'lb') : ' ea';
  const priceCls = unitPrice == null ? 'missing' : (isActual ? 'actual' : '');
  const priceLabel = unitPrice == null ? 'Add price' : money(unitPrice) + `<span class="ea">${perUnit}</span>`;

  const control = it.unitType === 'weight'
    ? `<div class="wtin">
         <input type="text" inputmode="decimal" value="${it.weight != null ? esc(numfmt(it.weight)) : ''}"
                data-act="weight" data-id="${it.id}" id="w-${it.id}" aria-label="Weight for ${esc(it.name)}">
         <span class="u">${esc(it.weightUnit || 'lb')}</span>
       </div>`
    : `<div class="stepper">
         <button data-act="qty" data-id="${it.id}" data-d="-1" class="${(it.qty || 1) <= 1 ? 'del' : ''}"
                 aria-label="${(it.qty || 1) <= 1 ? 'Remove ' + esc(it.name) : 'Decrease quantity'}">${svg((it.qty || 1) <= 1 ? 'trash' : 'minus')}</button>
         <span class="v">${numfmt(it.qty || 1)}</span>
         <button data-act="qty" data-id="${it.id}" data-d="1" aria-label="Increase quantity">${svg('plus')}</button>
       </div>`;

  return `<div class="li ${it.checked ? 'done' : ''}">
    <button class="check" role="checkbox" aria-checked="${it.checked}" data-act="check" data-id="${it.id}"
            aria-label="${it.checked ? 'Uncheck' : 'Check off'} ${esc(it.name)}"><span class="box">${svg('check')}</span></button>
    <div class="main">
      <div class="top">
        <div class="nm">${esc(it.name)}${p ? '' : ' <span class="pill">Removed</span>'}</div>
        <div class="tot ${total == null ? 'missing' : ''}">${total == null ? 'No price' : money(total)}</div>
      </div>
      <div class="sub">
        <div class="subwrap">
          <button class="chipbtn catbtn${it.categoryId ? '' : ' unset'}" data-act="category" data-id="${it.id}"
            aria-label="${it.categoryId ? 'Category: ' + esc(catName(it.categoryId)) + ' — change it' : 'Set a category for ' + esc(it.name)}"
            >${it.categoryId ? esc(catName(it.categoryId)) : 'Set category'}</button>
          <button class="chipbtn storebtn" data-act="store" data-id="${it.id}"
            aria-label="Store: ${esc(it.storeId ? storeName(it.storeId) : 'Unassigned')} — change it"
            >${esc(it.storeId ? storeName(it.storeId) : 'Unassigned')}</button>
          ${isActual && it.expectedPrice != null ? `<span class="mi"><span class="dot">·</span><span class="num">was ${money(it.expectedPrice)}${perUnit}</span></span>` : ''}
        </div>
        <button class="rm" data-act="remove" data-id="${it.id}" aria-label="Remove ${esc(it.name)} from list">${svg('x')}</button>
      </div>
      <div class="ctl">
        ${control}
        <button class="pricebtn ${priceCls}" data-act="price" data-id="${it.id}">${priceLabel}</button>
      </div>
    </div>
  </div>`;
}

/* The nav and totals bar are fixed; measure them so #screens always reserves
   exactly enough room and nothing sits under them at any width. */
function measureChrome() {
  const nav = document.querySelector('nav.tabs');
  const bar = document.querySelector('.bar');
  const r = document.documentElement;
  const railed = isRail();
  if (nav) r.style.setProperty('--nav-h', railed ? '0px' : Math.ceil(nav.offsetHeight) + 'px');
  const ab = document.querySelector('.appbar');
  if (ab) r.style.setProperty('--appbar-h', Math.ceil(ab.offsetHeight) + 'px');
  if (bar) {
    const navH = nav && !railed ? nav.offsetHeight : 0;
    r.style.setProperty('--bar-h', Math.ceil(bar.offsetHeight - navH) + 'px');
  } else {
    r.style.removeProperty('--bar-h');
  }
}

/* ============================================================
   SHEETS
   ============================================================ */
/* Sheets are a stack, so drilling from Settings into a store or category
   layers on top of Settings instead of replacing it — whatever is behind a
   sheet is the screen you came from, never the page underneath. Each layer
   keeps a builder rather than fixed markup, so every layer re-derives from
   current state whenever the stack is redrawn. */
let sheetStack = [];

function renderSheets() {
  const host = document.getElementById('sheets');
  if (!sheetStack.length) {
    ui.sheet = null; ui.drill = null;
    host.innerHTML = '';
    document.body.style.overflow = '';
    return;
  }
  /* keep whatever is typed in a product form across a redraw — including
     when another sheet is layered on top of the form */
  const top = sheetStack[sheetStack.length - 1];
  const draftLayer = sheetStack.find(e => e.opts && e.opts.draft);
  if (draftLayer && document.getElementById('f-name')) syncDraft(draftLayer.opts.draft);
  /* remember where each layer was scrolled to */
  const scrolls = [...host.querySelectorAll('.scrim .sheet-bd')].map(el => el.scrollTop);

  host.innerHTML = sheetStack.map((entry, i) => {
    const isTop = i === sheetStack.length - 1;
    return `<div class="scrim${isTop ? '' : ' under'}"${isTop ? ' data-act="scrim"' : ''}>
      <div class="sheet"${isTop ? ' role="dialog" aria-modal="true"' : ' inert aria-hidden="true"'}>${entry.build()}</div>
    </div>`;
  }).join('');
  document.body.style.overflow = 'hidden';
  ui.sheet = top.opts;
  host.querySelectorAll('.scrim .sheet-bd').forEach((el, i) => { if (scrolls[i]) el.scrollTop = scrolls[i]; });
  const f = document.querySelector('.scrim:last-child .sheet [data-autofocus]');
  if (f) setTimeout(() => { f.focus(); if (f.select) f.select(); }, 60);
}

/* mode: 'root' replaces the whole stack, 'push' layers on top */
function showSheet(build, opts, mode) {
  const entry = { build, opts: opts || {} };
  if (mode === 'push') sheetStack.push(entry); else sheetStack = [entry];
  renderSheets();
}
function openSheet(html, opts) { showSheet(() => html, opts, 'root'); }
function closeSheet() { sheetStack = []; renderSheets(); }
/* Step back one layer: product → store/category → Settings → page. */
function dismissSheet() {
  sheetStack.pop();
  if (!sheetStack.length) { closeSheet(); return; }
  const t = sheetStack[sheetStack.length - 1].opts;
  ui.drill = (t && (t.kind === 'store' || t.kind === 'cat')) ? { kind: t.kind, id: t.id } : null;
  renderSheets();
}
const sheetIsOpen = () => sheetStack.length > 0;

/* After a product goes on or off the list, redraw the open sheets (every
   layer rebuilds itself) and highlight the row that moved. */
function syncOpenSheet(productId) {
  if (!sheetIsOpen()) return;
  const res = document.getElementById('pickres');
  if (res) {
    /* patch just the results so the search box keeps focus mid-typing */
    res.innerHTML = pickResults(pickMatches());
  } else {
    renderSheets();
  }
  const row = document.querySelector(`.scrim:last-child .sheet [data-pid="${productId}"]`);
  if (row) row.classList.add('flash');
}
const sheetHead = (title, sub, extra) =>
