/* ============================================================
   BACKUP & RESTORE
   A backup is one JSON file holding everything the app keeps: the catalog
   (with stock status, favourites and price history), stores and categories
   including archived ones, settings, the current list and every trip.
   Restore replaces everything with the file's contents, only after a
   preview and confirmation, and keeps a safety copy first so it can be
   undone.
   ============================================================ */
const BACKUP_APP = 'pantry-run';
const BACKUP_VERSION = 1;
const SAFETY_LS_KEY = 'pantryrun.safety';
const SAFETY_CHUNK = 50000;            /* characters per db part — well under the 256 KiB doc cap */
let safetyHead = null;                 /* {createdAt, parts, counts, backupDate} or null */
let pendingRestore = null;             /* {data, meta, source:'file'|'undo'} */

function currentData() {
  return clone({
    products: S.products, stores: S.stores, categories: S.categories,
    settings: S.settings, active: S.active, trips: S.trips
  });
}
function dataCounts(d) {
  const listItems = d.active && Array.isArray(d.active.items) ? d.active.items.length : 0;
  return {
    products: d.products.length,
    low: d.products.filter(p => p.stock === 'low').length,
    need: d.products.filter(p => p.stock === 'need').length,
    favourites: d.products.filter(p => p.favourite).length,
    priceRecords: d.products.reduce((n, p) => n + (Array.isArray(p.priceHistory) ? p.priceHistory.length : 0), 0),
    stores: d.stores.filter(s => !s.archived).length,
    storesArchived: d.stores.filter(s => s.archived).length,
    categories: d.categories.filter(c => !c.archived).length,
    categoriesArchived: d.categories.filter(c => c.archived).length,
    trips: d.trips.length,
    listItems,
    taxRate: d.settings && d.settings.taxRate != null ? d.settings.taxRate : 13,
    currency: d.settings && CURRENCIES.some(x => x[0] === d.settings.currency) ? d.settings.currency : DEFAULT_CURRENCY,
    weightUnit: d.settings && WEIGHT_UNITS.includes(d.settings.weightUnit) ? d.settings.weightUnit : 'lb'
  };
}
function makeBackup() {
  const data = currentData();
  if (data.settings) delete data.settings.lastBackupAt;
  return { app: BACKUP_APP, kind: 'backup', version: BACKUP_VERSION,
    createdAt: new Date().toISOString(), counts: dataCounts(data), data };
}
function backupFilename(iso) {
  const d = iso ? new Date(iso) : new Date();
  const p = n => String(n).padStart(2, '0');
  return `pantry-run-backup-${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}.json`;
}
function markBackedUp() {
  S.settings.lastBackupAt = new Date().toISOString();
  Persist.saveMeta('settings');
}
function lastBackupLine() {
  const at = S.settings.lastBackupAt;
  if (!at) return 'No backup yet';
  const days = Math.floor((Date.now() - new Date(at).getTime()) / 86400000);
  return 'Last backup ' + (days <= 0 ? 'today' : days === 1 ? 'yesterday' : days + ' days ago');
}

/* ---------- validation ----------
   Anything that isn't clearly a Pantry Run backup is refused before the app
   touches a thing. Returns {ok:true, data, meta} or {ok:false, error}. */
const idOk = id => typeof id === 'string' && id.length > 0 && id.length <= 150 && !/[\/\s]/.test(id) && id !== '.' && id !== '..';
const isObj = o => o && typeof o === 'object' && !Array.isArray(o);
function parseBackup(text) {
  const bad = msg => ({ ok: false, error: msg });
  const NOT = 'This isn’t a Pantry Run backup file.';
  if (typeof text !== 'string' || !text.trim()) return bad('That file is empty.');
  let obj;
  try { obj = JSON.parse(text.replace(/^\uFEFF/, '')); } catch (e) { return bad(NOT + ' It couldn’t be read as a backup.'); }
  if (!isObj(obj) || obj.app !== BACKUP_APP || !isObj(obj.data)) return bad(NOT);
  if (typeof obj.version !== 'number' || obj.version < 1) return bad(NOT);
  if (obj.version > BACKUP_VERSION) return bad('This backup was made by a newer version of Pantry Run and can’t be restored here.');
  const d = obj.data;
  const damaged = what => bad('This backup is damaged (' + what + '), so nothing was restored.');
  for (const k of ['products', 'stores', 'categories', 'trips']) if (!Array.isArray(d[k])) return damaged(k + ' missing');
  if (d.settings != null && !isObj(d.settings)) return damaged('settings');
  if (d.active != null && !(isObj(d.active) && Array.isArray(d.active.items))) return damaged('shopping list');

  const uniq = (arr, label) => {
    const seen = new Set();
    for (const x of arr) {
      if (!isObj(x) || !idOk(x.id)) return label + ' without a valid id';
      if (seen.has(x.id)) return 'repeated ' + label + ' id';
      seen.add(x.id);
    }
    return null;
  };
  let e;
  if ((e = uniq(d.products, 'product'))) return damaged(e);
  if ((e = uniq(d.stores, 'store'))) return damaged(e);
  if ((e = uniq(d.categories, 'category'))) return damaged(e);
  if ((e = uniq(d.trips, 'trip'))) return damaged(e);
  if (d.products.some(p => typeof p.name !== 'string' || !p.name.trim())) return damaged('product without a name');
  if (d.stores.some(s => typeof s.name !== 'string')) return damaged('store without a name');
  if (d.categories.some(c => typeof c.name !== 'string')) return damaged('category without a name');
  if (d.trips.some(t => typeof t.date !== 'string' || !Array.isArray(t.items))) return damaged('trip without a date or items');

  /* light normalisation so older or hand-edited files still behave */
  const data = clone({
    products: d.products, stores: d.stores, categories: d.categories, trips: d.trips,
    settings: d.settings || {}, active: d.active || null
  });
  for (const p of data.products) {
    if (!['in', 'low', 'need'].includes(p.stock)) p.stock = 'in';
    p.favourite = !!p.favourite;
    if (!Array.isArray(p.priceHistory)) p.priceHistory = [];
  }
  data.settings = Object.assign({ taxRate: 13 }, data.settings, { id: 'app' });
  if (typeof data.settings.taxRate !== 'number' || !(data.settings.taxRate >= 0)) data.settings.taxRate = 13;
  if (!CURRENCIES.some(x => x[0] === data.settings.currency)) delete data.settings.currency;
  if (!WEIGHT_UNITS.includes(data.settings.weightUnit)) delete data.settings.weightUnit;
  delete data.settings.lastBackupAt;
  const created = typeof obj.createdAt === 'string' && !isNaN(new Date(obj.createdAt)) ? obj.createdAt : null;
  return { ok: true, data, meta: { createdAt: created } };
}

/* ---------- safety copy (for Undo restore) ---------- */
function writeQueued(path, fn) {
  /* like enqueue, but the caller hears about failures */
  const prev = queues.get(path) || Promise.resolve();
  const run = prev.catch(() => {}).then(fn);
  queues.set(path, run.catch(() => {}));
  return run;
}
async function runLimited(tasks, n) {
  let i = 0;
  const worker = async () => { while (i < tasks.length) { const t = tasks[i++]; await t(); } };
  await Promise.all(Array.from({ length: Math.min(n, tasks.length) }, worker));
}
async function saveSafety(data, backupDate) {
  const head = { createdAt: new Date().toISOString(), counts: dataCounts(data), backupDate: backupDate || null };
  const text = JSON.stringify(data);
  if (backend === 'db') {
    const parts = Math.max(1, Math.ceil(text.length / SAFETY_CHUNK));
    const old = safetyHead ? safetyHead.parts || 0 : 0;
    const tasks = [];
    for (let i = 0; i < parts; i++) {
      const s = text.slice(i * SAFETY_CHUNK, (i + 1) * SAFETY_CHUNK);
      tasks.push(() => writeQueued('safety/p' + i, () => DB.doc('safety/p' + i).set({ i, s })));
    }
    await runLimited(tasks, 4);
    head.parts = parts;
    await writeQueued('safety/head', () => DB.doc('safety/head').set(head));
    for (let i = parts; i < old; i++) writeQueued('safety/p' + i, () => DB.doc('safety/p' + i).delete()).catch(() => {});
  } else {
    localStorage.setItem(SAFETY_LS_KEY, JSON.stringify({ head, data }));   /* throws if storage is full */
  }
  safetyHead = head;
}
async function loadSafety() {
  if (!safetyHead) return null;
  if (backend === 'db') {
    const snaps = await Promise.all(Array.from({ length: safetyHead.parts }, (_, i) => DB.doc('safety/p' + i).get()));
    if (snaps.some(s => !s.exists)) return null;
    return JSON.parse(snaps.map(s => s.data().s).join(''));
  }
  const raw = JSON.parse(localStorage.getItem(SAFETY_LS_KEY) || 'null');
  return raw && raw.data ? raw.data : null;
}
async function clearSafety() {
  const old = safetyHead;
  safetyHead = null;
  if (backend === 'db') {
    await writeQueued('safety/head', () => DB.doc('safety/head').delete());
    for (let i = 0; i < (old ? old.parts || 0 : 0); i++) writeQueued('safety/p' + i, () => DB.doc('safety/p' + i).delete()).catch(() => {});
  } else {
    try { localStorage.removeItem(SAFETY_LS_KEY); } catch (e) { /* ignore */ }
  }
}
async function bootSafety() {
  try {
    if (backend === 'db') {
      const h = await DB.doc('safety/head').get();
      safetyHead = h.exists ? clone(h.data()) : null;
    } else {
      const raw = JSON.parse(localStorage.getItem(SAFETY_LS_KEY) || 'null');
      safetyHead = raw && raw.head ? raw.head : null;
    }
  } catch (e) { safetyHead = null; }
}

/* ---------- replacing everything ---------- */
async function replaceAllData(data) {
  const keepLast = S.settings.lastBackupAt;
  if (backend === 'db') {
    /* Ask the database which documents really exist, rather than trusting
       memory — so a retry after a failed restore still clears leftovers. */
    const [prods, trips] = await Promise.all([
      DB.collection('products').limit(1000).get(),
      DB.collection('trips').limit(1000).get()
    ]);
    const keepP = new Set(data.products.map(p => p.id));
    const keepT = new Set(data.trips.map(t => t.id));
    const settings = Object.assign({}, data.settings, keepLast ? { lastBackupAt: keepLast } : {});
    const tasks = [];
    data.products.forEach(p => tasks.push(() => writeQueued('products/' + p.id, () => DB.doc('products/' + p.id).set(p))));
    data.trips.forEach(t => tasks.push(() => writeQueued('trips/' + t.id, () => DB.doc('trips/' + t.id).set(t))));
    tasks.push(() => writeQueued('meta/stores', () => DB.doc('meta/stores').set({ items: data.stores })));
    tasks.push(() => writeQueued('meta/categories', () => DB.doc('meta/categories').set({ items: data.categories })));
    tasks.push(() => writeQueued('meta/settings', () => DB.doc('meta/settings').set(settings)));
    tasks.push(() => writeQueued('lists/active', () => data.active ? DB.doc('lists/active').set(data.active) : DB.doc('lists/active').delete()));
    await runLimited(tasks, 6);
    /* removals last, once everything from the backup is safely written */
    const dels = [];
    prods.docs.forEach(s => { if (!keepP.has(s.id)) dels.push(() => writeQueued('products/' + s.id, () => DB.doc('products/' + s.id).delete())); });
    trips.docs.forEach(s => { if (!keepT.has(s.id)) dels.push(() => writeQueued('trips/' + s.id, () => DB.doc('trips/' + s.id).delete())); });
    await runLimited(dels, 6);
  }
  S.products = clone(data.products); S.stores = clone(data.stores); S.categories = clone(data.categories);
  S.settings = Object.assign({ taxRate: 13 }, clone(data.settings), { id: 'app' });
  if (keepLast) S.settings.lastBackupAt = keepLast; else delete S.settings.lastBackupAt;
  S.active = clone(data.active); S.trips = clone(data.trips);
  S.products.sort((a, b) => a.name.localeCompare(b.name));
  S.trips.sort((a, b) => String(b.date).localeCompare(String(a.date)));
  if (backend !== 'db') {
    localStorage.setItem(LS_KEY, JSON.stringify(snapshotLocal()));
    if (JSON.parse(localStorage.getItem(LS_KEY)).products.length !== S.products.length) throw new Error('local save failed');
  }
  /* views may point at things that no longer exist */
  ui.filters = { cats: new Set(), stores: new Set(), stock: new Set(), fav: false };
  ui.catQuery = ''; ui.pickQuery = ''; ui.markQuery = ''; ui.drill = null;
}

async function doBackupDownload(btn) {
  const b = makeBackup();
  const text = JSON.stringify(b, null, 1);
  const name = backupFilename(b.createdAt);
  let dl = null;
  try { dl = await window.claude?.use?.('downloads'); } catch (e) { dl = null; }
  if (dl) {
    if (btn) btn.disabled = true;
    try {
      await dl.save({ filename: name, data: text });
      markBackedUp(); renderSheets(); toast('Backup saved', 'ok');
    } catch (err) {
      const code = err && err.code;
      if (code === 'declined') toast('Backup not saved');
      else if (code === 'rate_limited') toast('A save prompt is already open');
      else { showBackupText(text); toast('Downloads aren’t available here — copy the text instead'); }
    } finally { if (btn && btn.isConnected) btn.disabled = false; }
    return;
  }
  /* outside Claude: a plain browser download */
  try {
    const url = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
    const a = document.createElement('a');
    a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    markBackedUp(); renderSheets(); toast('Backup saved', 'ok');
  } catch (e) { showBackupText(text); }
}
function showBackupText(text) {
  const wrap = document.querySelector('.scrim:last-child #bk-text-wrap');
  const ta = document.querySelector('.scrim:last-child #bk-text');
  if (!wrap || !ta) return;
  wrap.hidden = false; ta.value = text;
  ta.focus(); ta.select();
}
async function doBackupCopy() {
  const text = JSON.stringify(makeBackup());
  let copied = false;
  try { await navigator.clipboard.writeText(text); copied = true; } catch (e) { copied = false; }
  if (copied) { markBackedUp(); renderSheets(); toast('Backup copied — paste it somewhere safe', 'ok'); }
  else { showBackupText(text); toast('Select all and copy the text below'); }
}

}
function sheetRestore() { commitTaxField(); ui.restoreErr = null; ui.restoreText = ''; showSheet(buildRestore, { kind: 'restore' }, 'push'); }

function acceptBackupText(text) {
  const r = parseBackup(text);
  if (!r.ok) { ui.restoreErr = r.error; renderSheets(); return false; }
  ui.restoreErr = null;
  pendingRestore = { data: r.data, meta: r.meta, source: 'file' };
  showSheet(buildRestorePreview, { kind: 'restore-preview' }, 'push');
  return true;
}

function compareRows(now, next) {
  const row = (label, a, b) => {
    const diff = String(a) !== String(b);
    return `<tr${diff ? ' class="diff"' : ''}><th scope="row">${label}</th><td>${esc(String(a))}</td><td>${esc(String(b))}</td></tr>`;
  };
  return `<table class="cmp num">
    <thead><tr><th></th><th scope="col">Now</th><th scope="col">${pendingRestore && pendingRestore.source === 'undo' ? 'Before restore' : 'Backup'}</th></tr></thead>
    <tbody>
      ${row('Products', now.products, next.products)}
      ${row('Running low', now.low, next.low)}
      ${row('Need to buy', now.need, next.need)}
      ${row('Favourites', now.favourites, next.favourites)}
      ${row('Stores', now.stores, next.stores)}
      ${row('Categories', now.categories, next.categories)}
      ${now.storesArchived + now.categoriesArchived + next.storesArchived + next.categoriesArchived
        ? row('Archived', now.storesArchived + now.categoriesArchived, next.storesArchived + next.categoriesArchived) : ''}
      ${row('Trips', now.trips, next.trips)}
      ${row('On the list', now.listItems, next.listItems)}
      ${row('Currency', now.currency, next.currency)}
      ${row('Weight unit', now.weightUnit, next.weightUnit)}
      ${row('Tax rate', numfmt(now.taxRate) + '%', numfmt(next.taxRate) + '%')}
    </tbody></table>`;
}
function buildRestorePreview() {
  const pr = pendingRestore;
  if (!pr) return sheetHead('Nothing to restore') + `<div class="sheet-bd"><div class="empty">Choose a backup file first.</div></div>`;
  const undo = pr.source === 'undo';
  const now = dataCounts(currentData()), next = dataCounts(pr.data);
  const when = pr.meta.createdAt;
  const sub = undo ? 'Your data from before the restore'
    : when ? 'Backup from ' + new Date(when).toLocaleString([], { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' })
    : 'Backup file (no date)';
  const empty = !next.products && !next.trips && !next.listItems;
  return sheetHead(undo ? 'Undo the restore?' : 'Restore this backup?', sub) + `
    <div class="sheet-bd">
      ${compareRows(now, next)}
      ${empty ? `<div class="restore-err" role="alert">This ${undo ? 'copy' : 'backup'} has no products, trips or list — restoring it leaves the app empty.</div>` : ''}
      <ul class="impact" style="margin-top:14px">
        <li><b>Everything in the app now is replaced</b> — products, stock status, favourites, stores, categories, settings, the shopping list and history. Nothing is merged.</li>
      </ul>
      <ul class="impact keep" style="margin-top:8px">
        ${undo
          ? `<li>This puts back exactly what you had before the restore.</li>`
          : `<li><b>A safety copy</b> of what you have now is kept first, so you can <b>Undo restore</b> from Settings.</li>`}
      </ul>
    </div>
    <div class="sheet-ft">
      <button class="btn" data-act="close">Cancel</button>
      <button class="btn dangerfill" data-act="restore-confirm" id="restore-go">${undo ? 'Undo' : 'Restore'}</button>
    </div>`;
}

function buildBusy(title) {
  return sheetHead(title) + `<div class="sheet-bd"><div class="busy" role="status"><span class="spin"></span>Don’t close the app — this takes a moment.</div></div>`;
}
function buildRestoreDone() {
  const r = ui.restoreResult || {};
  const ok = r.ok;
  return sheetHead(ok ? (r.undo ? 'Restore undone' : 'Backup restored') : 'Restore didn’t finish') + `
    <div class="sheet-bd">
      ${ok
        ? `<div class="sec-note" style="margin:0">${r.undo ? 'Your data is back to how it was before the restore.'
            : 'Your data now matches the backup' + (r.when ? ' from ' + esc(fmtDate(r.when, true)) : '') + '.'}</div>
           <div class="card" style="padding:4px 14px;margin-top:12px">
             <div class="kv"><span class="k">Products</span><span class="v">${S.products.length}</span></div>
             <div class="kv"><span class="k">Trips</span><span class="v">${S.trips.length}</span></div>
             <div class="kv"><span class="k">On the list</span><span class="v">${S.active && S.active.items ? S.active.items.length : 0}</span></div>
           </div>`
        : `<div class="restore-err" role="alert" style="margin-top:0">${esc(r.message || 'Something went wrong.')}</div>`}
    </div>
    <div class="sheet-ft">
      ${!r.undo && safetyHead ? `<button class="btn" data-act="restore-undo">Undo restore</button>` : ''}
      <button class="btn primary" data-act="restore-finish">Done</button>
    </div>`;
}

let restoring = false;
async function runRestore() {
  const pr = pendingRestore;
  if (!pr || restoring) return;
  restoring = true;
  const undo = pr.source === 'undo';
  showSheet(() => buildBusy(undo ? 'Undoing restore…' : 'Restoring…'), { kind: 'busy' }, 'root');
  /* 1. keep a safety copy of what's here now — if that can't be kept,
        stop before anything is replaced */
  if (!undo) {
    try { await saveSafety(currentData(), pr.meta.createdAt); }
    catch (e) {
      console.error(e);
      restoring = false; pendingRestore = null;
      ui.restoreResult = { ok: false, undo, message: 'Couldn’t keep a safety copy of your current data, so nothing was changed.' };
      showSheet(buildRestoreDone, { kind: 'restore-done' }, 'root'); render();
      return;
    }
  }
  /* 2. replace */
  try {
    await replaceAllData(pr.data);
    if (undo) await clearSafety().catch(() => {});
    ui.restoreResult = { ok: true, undo, when: pr.meta.createdAt };
  } catch (e) {
    console.error(e);
    ui.restoreResult = { ok: false, undo, message: undo
      ? 'Undo didn’t finish. Your safety copy is still kept — try Undo restore again from Settings.'
      : 'Some of the backup didn’t save. Your previous data is kept as a safety copy — tap Undo restore to put it back, or try the restore again.' };
    if (backend === 'db') await reloadFromDb().catch(() => {});
  }
  restoring = false; pendingRestore = null;
  view = 'home';
  showSheet(buildRestoreDone, { kind: 'restore-done' }, 'root');
  render();
}
/* After a partial failure, show what the database really holds. */
async function reloadFromDb() {
  const [prods, stores, cats, sets, act, trips] = await Promise.all([
    DB.collection('products').limit(1000).get(), DB.doc('meta/stores').get(), DB.doc('meta/categories').get(),
    DB.doc('meta/settings').get(), DB.doc('lists/active').get(), DB.collection('trips').orderBy('date', 'desc').limit(200).get()
  ]);
  S.products = prods.docs.map(d => clone(d.data())).sort((a, b) => a.name.localeCompare(b.name));
  S.stores = stores.exists ? clone(stores.data().items || []) : [];
  S.categories = cats.exists ? clone(cats.data().items || []) : [];
  S.settings = Object.assign({ taxRate: 13, id: 'app' }, sets.exists ? clone(sets.data()) : {});
  S.active = act.exists ? clone(act.data()) : null;
  S.trips = trips.docs.map(d => clone(d.data()));
}
async function startUndo() {
  if (!safetyHead) { toast('There’s no restore to undo'); return; }
  let data = null;
  try { data = await loadSafety(); } catch (e) { data = null; }
  if (!data) { toast('The safety copy couldn’t be read'); return; }
  const r = parseBackup(JSON.stringify({ app: BACKUP_APP, version: BACKUP_VERSION, data }));
  if (!r.ok) { toast('The safety copy couldn’t be read'); return; }
  pendingRestore = { data: r.data, meta: { createdAt: safetyHead.createdAt }, source: 'undo' };
  showSheet(buildRestorePreview, { kind: 'restore-preview' }, sheetIsOpen() ? 'push' : 'root');
}

/* ============================================================
   EVENTS
   ============================================================ */
/* Any uncaught error here used to make a control look dead. Surface it
   instead, so a failure is visible rather than silent. */
document.addEventListener('click', e => {
  try { handleClick(e); }
  catch (err) {
    console.error(err);
    toast('That didn’t go through — ' + (err && err.message ? err.message : 'unexpected error'));
  }
});

function handleClick(e) {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  if (restoring) return;   /* nothing else happens while data is being replaced */

  switch (act) {
    case 'go': go(el.dataset.v); return;
    case 'scrim': if (e.target === el) dismissSheet(); return;
    case 'close': dismissSheet(); return;
    case 'settings': sheetSettings(); return;
    case 'open-store': commitTaxField(); sheetStoreDetail(id); return;
    case 'open-cat': commitTaxField(); sheetCategoryDetail(id); return;
    case 'toggle-done': ui.showDone = !el.hasAttribute('open'); return;

    case 'start-list': ensureActive(); go('list'); return;

    case 'quick-add': {
      const r = addProductToList(id);
      if (r) toast(r.note, 'ok');
      render();
      syncOpenSheet(id);
      markJustSet(`.addbtn[data-id="${id}"]`);
      return;
    }
    case 'add-menu': showSheet(buildAddMenu, {}, 'root'); return;
    case 'dup-add-anyway': {
      const layer = sheetStack.find(e => e.opts && e.opts.draft);
      if (!layer) { closeSheet(); return; }
      const d = layer.opts.draft;
      saveProduct(d);                 /* a separate product — nothing is merged */
      closeThroughDraft(); render();
      toast(d.name + ' added as a separate product', 'ok');
      return;
    }
    case 'dup-open': {
      const layer = sheetStack.find(e => e.opts && e.opts.draft);
      const typed = layer ? layer.opts.draft.name : '';
      const existing = productById(id); if (!existing) return;
      closeSheet(); render();
      sheetProduct(id);
      toast(`Opened ${existing.name}${typed ? ` — “${typed}” wasn’t added` : ''}`);
      return;
    }
    case 'menu-add-cat': {
      const inp = document.querySelector('.scrim:last-child #menu-newcat');
      const r = addCategory(inp ? inp.value : '');
      if (!r) { toast('Give the category a name'); if (inp) inp.focus(); return; }
      if (r.duplicate) { toast(r.rec.name + ' is already a category'); if (inp) inp.select(); return; }
      closeSheet(); render();
      toast(r.restored ? r.rec.name + ' restored from archive' : r.rec.name + ' added', 'ok');
      return;
    }
    case 'open-filter': sheetFilter(); return;
    case 'toggle-filter': {
      const g = el.dataset.g, v = el.dataset.v;
      if (g === 'fav') ui.filters.fav = !ui.filters.fav;
      else { const set = ui.filters[g]; if (set.has(v)) set.delete(v); else set.add(v); }
      renderSheets(); render(); return;
    }
    case 'drop-filter': {
      const g = el.dataset.g, v = el.dataset.v;
      if (g === 'fav') ui.filters.fav = false; else ui.filters[g].delete(v);
      render(); return;
    }
    case 'clear-filters': {
      clearFilters();
      if (sheetIsOpen()) renderSheets();
      render(); return;
    }
    case 'toggle-fav': {
      const p = productById(id); if (!p) return;
      p.favourite = !p.favourite;
      if (!p.favourite) delete p.favourite;
      saveProduct(p);
      el.setAttribute('aria-pressed', String(!!p.favourite));
      if (p.favourite) { el.classList.remove('justset'); void el.offsetWidth; el.classList.add('justset'); }
      toast(p.favourite ? p.name + ' added to favourites' : p.name + ' removed from favourites', p.favourite ? 'ok' : undefined);
      /* only re-render when a favourites filter would change what's shown */
      if (ui.filters.fav) render();
      return;
    }
    case 'draft-fav': {
      const d = ui.sheet && ui.sheet.draft; if (!d) return;
      d.favourite = !d.favourite;
      el.setAttribute('aria-pressed', String(!!d.favourite));
      el.setAttribute('aria-label', d.favourite ? 'Favourite — tap to remove' : 'Mark as favourite');
      return;
    }
    case 'mark-stock': sheetMarkStock(); return;
    case 'set-stock-quick': {
      const p = productById(id); if (!p) return;
      const want = el.dataset.v;
      p.stock = (p.stock === want) ? 'in' : want;   /* tapping the active one clears it */
      saveProduct(p);
      /* update just this row so a long catalog doesn't jump under your thumb */
      const row = document.querySelector(`.scrim:last-child .markrow[data-pid="${id}"]`);
      if (row) {
        row.querySelectorAll('.stockbtn').forEach(btn =>
          btn.setAttribute('aria-pressed', String(p.stock === btn.dataset.v)));
      }
      const hd = document.querySelector('.scrim:last-child .sheet-hd .sub');
      if (hd) {
        const n = S.products.filter(x => x.stock === 'low' || x.stock === 'need').length;
        hd.textContent = n ? n + ' marked so far' : 'Tap Low or Need on anything';
      }
      render();
      return;
    }
    case 'quick-remove': {
      const p = productById(id);
      const gone = removeProductFromList(id);
      toast(gone ? (p ? p.name : 'Item') + ' removed from list'
                 : 'That product isn’t on the list');
      render();
      syncOpenSheet(id);
      return;
    }


    case 'new-product': closeSheet(); sheetProduct(null); return;
    case 'open-product': sheetProduct(id); return;

    case 'ptype': {
      const d = ui.sheet.draft; if (!d) return;
      syncDraft();
      d.unitType = el.dataset.v;
      refreshProductSheetPrice(); return;
    }
    case 'wunit': {
      const d = ui.sheet.draft; if (!d) return;
      syncDraft();
      d.weightUnit = el.dataset.v;
      refreshProductSheetPrice(); return;
    }
    case 'stock': {
      const d = ui.sheet.draft; if (!d) return;
      d.stock = el.dataset.v;
      el.parentElement.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b === el)));
      return;
    }
    case 'save-product': saveProductSheet(); return;
    case 'delete-product': {
      const p = productById(id); if (!p) return;
      if (el.dataset.confirm !== '1') {
        el.dataset.confirm = '1';
        el.innerHTML = svg('trash') + 'Tap again to delete ' + esc(p.name);
        setTimeout(() => { if (el.isConnected) { el.dataset.confirm = ''; el.innerHTML = svg('trash') + 'Delete product'; } }, 3500);
        return;
      }
      S.products = S.products.filter(x => x.id !== id);
      Persist.deleteProduct(id);
      dismissSheet(); render(); toast(p.name + ' deleted');
      return;
    }

    /* --- list item interactions --- */
    case 'check': {
      const it = findItem(id); if (!it) return;
      const goingIn = !it.checked;
      it.checked = !it.checked;
      it.checkedAt = it.checked ? todayISO() : null;
      if (ui.openItem === id) ui.openItem = null;
      if (it.checked) ui.showDone = false;
      Persist.saveActive();
      /* show the completed state, let the row fade out, then move it into
         Completed Items — never an instant disappearance */
      const row = el.closest('.li');
      if (goingIn && row && !reduceMotion()) {
        el.setAttribute('aria-checked', 'true');
        row.classList.add('leaving');
        renderBar();                       /* totals update straight away */
        clearTimeout(checkTimer);
        checkTimer = setTimeout(render, 170);
      } else {
        render();
      }
      return;
    }
    case 'qty': {
      const it = findItem(id); if (!it) return;
      const d = Number(el.dataset.d);
      const next = (it.qty || 1) + d;
      if (next < 1) { removeListItem(id); toast(it.name + ' removed'); render(); return; }
      it.qty = next; Persist.saveActive(); render(); return;
    }
    case 'expand': {
      ui.openItem = ui.openItem === id ? null : id;
      render();
      return;
    }
    case 'arrange-cats': commitTaxField(); showSheet(buildArrange, { kind: 'arrange' }, sheetIsOpen() ? 'push' : 'root'); return;
    case 'cat-move': {
      const d = Number(el.dataset.d);
      if (!moveCategory(id, d)) return;
      renderSheets(); render();
      /* keep focus on the category being moved, so it can be nudged again */
      const again = document.querySelector(`.scrim:last-child [data-act="cat-move"][data-id="${id}"][data-d="${d}"]`);
      const other = document.querySelector(`.scrim:last-child [data-act="cat-move"][data-id="${id}"][data-d="${-d}"]`);
      (again && !again.disabled ? again : other)?.focus();
      document.querySelector(`.scrim:last-child .arrrow[data-cid="${id}"]`)?.classList.add('flash');
      return;
    }
    case 'remove': {
      const it = findItem(id); if (!it) return;
      if (ui.openItem === id) ui.openItem = null;
      removeListItem(id); toast(it.name + ' removed'); render(); return;
    }
    case 'price': sheetPrice(id); return;
    case 'price-save': {
      const it = findItem(id); if (!it) return;
      const v = parseNum(document.getElementById('pr-in').value);
      it.actualPrice = (v != null && v >= 0) ? v : null;
      Persist.saveActive(); closeSheet(); render(); return;
    }
    case 'price-clear': {
      const it = findItem(id); if (!it) return;
      it.actualPrice = null; Persist.saveActive(); closeSheet(); render(); return;
    }
    case 'store': sheetStore(id); return;
    case 'category': sheetCategoryPick(id); return;
    case 'set-cat': {
      const it = findItem(id); if (!it) return;
      setItemCategory(it, el.dataset.cat || null);
      closeSheet(); render(); return;
    }
    case 'add-cat-for': {
      const inp = document.querySelector('.scrim:last-child #newcat');
      const r = addCategory(inp ? inp.value : '');
      if (!r) { toast('Give the category a name'); return; }
      const it = findItem(id);
      if (it) setItemCategory(it, r.rec.id);
      closeSheet(); render();
      toast(r.restored ? r.rec.name + ' restored from archive' : r.duplicate ? 'Using existing ' + r.rec.name : r.rec.name + ' added', 'ok');
      return;
    }
    case 'set-store': {
      const it = findItem(id); if (!it) return;
      it.storeId = el.dataset.store || null;
      if (it.actualPrice == null) {
        const p = productById(it.productId);
        if (p) it.expectedPrice = expectedPriceFor(p, it.storeId);
      }
      Persist.saveActive(); closeSheet(); render(); return;
    }
    case 'add-store-for': {
      const inp = document.querySelector('.scrim:last-child #newstore');
      const r = addStore(inp ? inp.value : '');
      if (!r) { toast('Give the store a name'); return; }
      const it = findItem(id);
      if (it) {
        it.storeId = r.rec.id;
        if (it.actualPrice == null) { const p = productById(it.productId); if (p) it.expectedPrice = expectedPriceFor(p, r.rec.id); }
        Persist.saveActive();
      }
      closeSheet(); render();
      toast(r.restored ? r.rec.name + ' restored from archive' : r.duplicate ? 'Using existing ' + r.rec.name : r.rec.name + ' added', 'ok');
      return;
    }

    case 'fold': {
      const scope = el.dataset.scope, key = el.dataset.key;
      const set = ui.collapsed[scope]; if (!set) return;
      if (set.has(key)) set.delete(key); else set.add(key);
      if (scope === 'pick') { document.getElementById('pickres').innerHTML = pickResults(pickMatches()); return; }
      if (scope === 'mark') { document.getElementById('markres').innerHTML = markResults(); return; }
      render(); return;
    }
    case 'group': ui.listGroup = el.dataset.v; render(); return;
    case 'pick-items': {
      if (isSplit() && view === 'list') {
        const f = document.getElementById('pickq-side');
        if (f) { f.focus(); f.select(); return; }
      }
      ui.pickQuery = ''; sheetPick(); return;
    }

    case 'finish': sheetFinish(); return;
    case 'finish-confirm': finishTrip(); return;
    case 'psel': {
      const set = ui.sheet.priceSel; if (!set) return;
      const on = el.getAttribute('aria-checked') === 'true';
      if (on) set.delete(id); else set.add(id);
      el.setAttribute('aria-checked', String(!on)); return;
    }
    case 'apply-prices': {
      const { priceChanges, priceSel } = ui.sheet;
      let n = 0;
      for (const c of priceChanges) {
        if (!priceSel.has(c.productId)) continue;
        const p = productById(c.productId);
        if (p) { p.usualPrice = c.next; Persist.saveProduct(p); n++; }
      }
      closeSheet(); render();
      toast(n ? n + (n === 1 ? ' usual price updated' : ' usual prices updated') : 'Usual prices unchanged');
      return;
    }

    case 'open-trip': sheetTrip(id); return;
    case 'rename-trip': {
      const inp = document.querySelector('.scrim:last-child #trip-name');
      const t = renameTrip(id, inp ? inp.value : '');
      if (!t) return;
      renderSheets(); render();
      toast(t.name ? 'Renamed to “' + t.name + '”' : 'Name cleared — showing the date', 'ok');
      return;
    }
    case 'ask-delete-trip': {
      if (!S.trips.some(x => x.id === id)) return;
      showSheet(() => buildDeleteTrip(id), { tripId: id }, 'push');
      return;
    }
    case 'confirm-delete-trip': {
      const plan = deleteTrip(id);
      if (!plan) { closeSheet(); render(); return; }
      closeSheet(); render();
      toast(`Trip deleted — ${plan.priceRecords} price ${plan.priceRecords === 1 ? 'record' : 'records'} removed, products kept`);
      return;
    }
    case 'tsel': {
      const set = ui.sheet.tripSel; if (!set) return;
      const on = el.getAttribute('aria-checked') === 'true';
      if (on) set.delete(id); else set.add(id);
      el.setAttribute('aria-checked', String(!on));
      const btn = document.getElementById('addsel');
      if (btn) { btn.disabled = set.size === 0; btn.textContent = set.size ? `Add Selected Again (${set.size})` : 'Add Selected Again'; }
      return;
    }
    case 'add-selected': {
      const t = S.trips.find(x => x.id === id); if (!t) return;
      const set = ui.sheet.tripSel;
      const picked = (t.items || []).filter(i => set.has(i.id));
      const n = copyItemsToList(picked);
      closeSheet(); go('list');
      toast(n + (n === 1 ? ' item added' : ' items added'));
      return;
    }
    case 'repeat': {
      const t = S.trips.find(x => x.id === id); if (!t) return;
      const had = !!(S.active && S.active.items.length);
      const n = copyItemsToList(t.items || []);
      closeSheet(); go('list');
      toast(had ? n + ' items added to your list' : 'Trip copied — ' + n + ' items');
      return;
    }

    /* --- settings --- */
    case 'add-store': {
      const inp = document.querySelector('.scrim:last-child #s-newstore');
      const r = addStore(inp ? inp.value : '');
      if (!r) { toast('Give the store a name'); return; }
      sheetSettings(); render();
      toast(r.restored ? r.rec.name + ' restored from archive' : r.duplicate ? r.rec.name + ' is already saved' : r.rec.name + ' added', 'ok');
      return;
    }
    case 'archive-store': case 'archive-cat': {
      const kind = act === 'archive-store' ? 'store' : 'cat';
      const rec = archiveRecord(kind, id, true);
      if (!rec) return;
      sheetSettings(); render();
      toast(rec.name + ' archived — restore it under Archived'); return;
    }
    case 'restore-store': case 'restore-cat': {
      const kind = act === 'restore-store' ? 'store' : 'cat';
      const rec = archiveRecord(kind, id, false);
      if (!rec) return;
      sheetSettings(); render();
      toast(rec.name + ' restored', 'ok'); return;
    }
    case 'purge-store': case 'purge-cat': {
      const kind = act === 'purge-store' ? 'store' : 'cat';
      const rec = (kind === 'store' ? S.stores : S.categories).find(x => x.id === id);
      if (!rec) return;
      const n = kind === 'store' ? productsForStore(id).length : productsForCategory(id).length;
      if (!armDelete(el, 'Delete ' + rec.name + ' permanently',
        `Delete ${rec.name} for good? Past trips and price history will stop showing its name${
          n ? `, and ${n} product${n === 1 ? '' : 's'} will lose it` : ''}. Tap again to confirm.`)) return;
      purgeRecord(kind, id);
      sheetSettings(); render(); toast(rec.name + ' deleted permanently'); return;
    }
    case 'rename-store': case 'rename-cat': {
      const kind = act === 'rename-store' ? 'store' : 'cat';
      const input = document.querySelector('.scrim:last-child #rename');
      const rec = renameRecord(kind, id, input ? input.value : '');
      if (!rec) { if (input) input.focus(); return; }
      renderSheets(); render(); toast('Renamed to ' + rec.name, 'ok'); return;
    }
    case 'add-cat': {
      const inp = document.querySelector('.scrim:last-child #s-newcat');
      const r = addCategory(inp ? inp.value : '');
      if (!r) { toast('Give the category a name'); return; }
      sheetSettings(); render();
      toast(r.restored ? r.rec.name + ' restored from archive' : r.duplicate ? r.rec.name + ' is already saved' : r.rec.name + ' added', 'ok');
      return;
    }
    case 'backup-open': sheetBackup(); return;
    case 'backup-download': doBackupDownload(el); return;
    case 'backup-copy': doBackupCopy(); return;
    case 'restore-open': sheetRestore(); return;
    case 'restore-choose': {
      const f = document.querySelector('.scrim:last-child #restore-file');
      if (f) { f.value = ''; f.click(); }
      return;
    }
    case 'restore-check': {
      const ta = document.querySelector('.scrim:last-child #restore-text');
      ui.restoreText = ta ? ta.value : '';
      acceptBackupText(ui.restoreText);
      return;
    }
    case 'restore-confirm': runRestore(); return;
    case 'restore-undo': startUndo(); return;
    case 'restore-finish': closeSheet(); render(); return;
    case 'set-wunit-default': {
      const u = el.dataset.v;
      if (!WEIGHT_UNITS.includes(u)) return;
      commitTaxField();
      S.settings.weightUnit = u; Persist.saveMeta('settings');
      renderSheets(); toast('New weighed products will use ' + u, 'ok');
      return;
    }
    case 'save-settings': {
      const v = parseNum(document.getElementById('f-tax').value);
      S.settings.taxRate = (v != null && v >= 0) ? v : 0;
      Persist.saveMeta('settings');
      closeSheet(); render(); return;
    }
  }
}

/* settings that apply the moment they change */
document.addEventListener('change', e => {
  if (e.target.id === 'f-currency') {
    const c = e.target.value;
    if (!CURRENCIES.some(x => x[0] === c)) return;
    commitTaxField();
    S.settings.currency = c; Persist.saveMeta('settings');
    renderSheets(); render();
    toast('Prices now shown in ' + c, 'ok');
  } else if (e.target.id === 'f-tax') {
    commitTaxField(); render();
  }
});

/* backup file chosen */
document.addEventListener('change', async e => {
  if (e.target.id !== 'restore-file') return;
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  if (file.size > 25 * 1024 * 1024) { ui.restoreErr = 'That file is too large to be a Pantry Run backup.'; renderSheets(); return; }
  let text = '';
  try { text = await file.text(); }
  catch (err) { ui.restoreErr = 'That file couldn’t be opened.'; renderSheets(); return; }
  acceptBackupText(text);
});

/* text inputs */
document.addEventListener('input', e => {
  if (e.target.id === 'restore-text') { ui.restoreText = e.target.value; return; }
  const el = e.target.closest('[data-act]');
  if (!el) return;
  if (el.dataset.act === 'cat-search') {
    ui.catQuery = el.value;
    const scroll = window.scrollY;
    render();
    const q = document.getElementById('catsearch');
    if (q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
    window.scrollTo(0, scroll);
  } else if (el.dataset.act === 'pick-search') {
    ui.pickQuery = el.value;
    document.getElementById('pickres').innerHTML = pickResults(pickMatches());
  } else if (el.dataset.act === 'mark-search') {
    ui.markQuery = el.value;
    document.getElementById('markres').innerHTML = markResults();
  }
});

/* weight commits on blur / Enter so totals don't thrash while typing */
document.addEventListener('change', e => {
  const el = e.target.closest('[data-act="weight"]');
  if (!el) return;
  const it = findItem(el.dataset.id); if (!it) return;
  const v = parseNum(el.value);
  it.weight = (v != null && v >= 0) ? v : null;
  Persist.saveActive(); render();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && ui.sheet && !restoring) { dismissSheet(); return; }
  if (e.key !== 'Enter') return;
  const w = e.target.closest('[data-act="weight"]');
  if (w) { e.target.blur(); return; }
  if (e.target.id === 'pr-in') {
    e.preventDefault();
    document.querySelector('[data-act="price-save"]')?.click();
  }
  if (e.target.id === 'newstore') { e.preventDefault(); document.querySelector('[data-act="add-store-for"]')?.click(); }
  if (e.target.id === 'newcat') { e.preventDefault(); document.querySelector('[data-act="add-cat-for"]')?.click(); }
  if (e.target.id === 'trip-name') { e.preventDefault(); document.querySelector('.scrim:last-child [data-act="rename-trip"]')?.click(); }
  if (e.target.id === 'menu-newcat') { e.preventDefault(); document.querySelector('.scrim:last-child [data-act="menu-add-cat"]')?.click(); }
  if (e.target.id === 's-newstore') { e.preventDefault(); document.querySelector('[data-act="add-store"]')?.click(); }
  if (e.target.id === 's-newcat') { e.preventDefault(); document.querySelector('[data-act="add-cat"]')?.click(); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'f-freq') {
    const wrap = document.getElementById('f-customfreq');
    if (wrap) wrap.hidden = e.target.value !== 'custom';
  }
});

/* ---------------- product sheet plumbing ---------------- */
function syncDraft(target) {
  const d = target || (ui.sheet && ui.sheet.draft); if (!d) return;
  const g = id => document.getElementById(id);
  if (g('f-name')) d.name = g('f-name').value.trim();
  if (g('f-cat')) d.categoryId = g('f-cat').value || null;
  if (g('f-price')) d.usualPrice = parseNum(g('f-price').value);
  if (g('f-qty')) {
    const v = parseNum(g('f-qty').value);
    if (d.unitType === 'weight') d.defaultWeight = (v != null && v > 0) ? v : 1;
    else d.defaultQty = (v != null && v > 0) ? Math.round(v) : 1;
  }
  if (g('f-pkg')) d.packageSize = g('f-pkg').value.trim();
  if (g('f-store')) d.preferredStoreId = g('f-store').value || null;
  if (g('f-shelf')) d.shelfLife = g('f-shelf').value.trim();
  if (g('f-freq')) d.frequency = g('f-freq').value;
  if (g('f-customfreq-in')) d.customFrequency = g('f-customfreq-in').value.trim();
  if (g('f-notes')) d.notes = g('f-notes').value.trim();
}
function refreshProductSheetPrice() {
  const d = ui.sheet.draft;
  const weighted = d.unitType === 'weight';
  document.querySelectorAll('[data-act="ptype"]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === d.unitType)));
  document.querySelectorAll('[data-act="wunit"]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === (d.weightUnit || 'lb'))));
  const wu = document.getElementById('f-wtunit');
  if (wu) wu.hidden = !weighted;
  const block = document.getElementById('f-priceblock');
  if (!block) return;
  block.innerHTML = `
    <div class="pair">
      <div class="field">
        <label for="f-price">Usual price</label>
        <div class="pre"><span class="sym">${esc(currencySymbol())}</span><input id="f-price" type="text" inputmode="decimal" placeholder="0.00"
          value="${d.usualPrice != null ? esc(Number(d.usualPrice).toFixed(2)) : ''}">
          <span class="suf">${weighted ? '/ ' + esc(d.weightUnit || 'lb') : 'each'}</span></div>
      </div>
      <div class="field">
        <label for="f-qty">${weighted ? 'Typical weight' : 'Default quantity'}</label>
        <div class="pre"><input id="f-qty" type="text" inputmode="decimal"
          value="${esc(weighted ? numfmt(d.defaultWeight || 1) : numfmt(d.defaultQty || 1))}">
          <span class="suf">${weighted ? esc(d.weightUnit || 'lb') : 'default'}</span></div>
      </div>
    </div>`;
}
function saveProductSheet() {
  syncDraft();
  const d = ui.sheet.draft;
  const wasNew = ui.sheet.isNew;
  if (!d.name) {
    toast('Give the product a name');
    document.getElementById('f-name')?.focus();
    return;
  }
  /* new products only: check for likely duplicates and warn before saving.
     Re-checks on every Save, so fixing the name clears the warning. */
  if (wasNew) {
    const matches = findDuplicates(d.name, d.id);
    if (matches.length) {
      showSheet(() => buildDupWarning(d.name, matches), { dupFor: d }, 'push');
      return;
    }
  }
  saveProduct(d);
  dismissSheet(); render();
  toast(wasNew ? d.name + ' added to your catalog' : d.name + ' saved');
}
/* close the duplicate warning and the new-product form beneath it */
function closeThroughDraft() {
  while (sheetStack.length) {
    const e = sheetStack.pop();
    if (e.opts && e.opts.draft) break;
  }
  if (sheetStack.length) renderSheets(); else closeSheet();
}

/* ---------------- trip actions ---------------- */
function copyItemsToList(items) {
  const list = ensureActive();
  let n = 0;
  for (const src of items) {
    const p = productById(src.productId);
    if (p) {
      if (onActiveList(p.id)) continue;
      const storeId = src.storeId || p.preferredStoreId || null;
      list.items.push(makeListItem(p, {
        storeId,
        qty: src.unitType === 'weight' ? 1 : (src.qty || p.defaultQty || 1),
        weight: src.unitType === 'weight' ? (src.weight || p.defaultWeight || 1) : null,
        expectedPrice: expectedPriceFor(p, storeId)
      }));
    } else {
      /* product no longer in the catalog — carry the snapshot forward */
      list.items.push(Object.assign({}, src, {
        id: uid('li'), checked: false, checkedAt: null, actualPrice: null
      }));
    }
    n++;
  }
  Persist.saveActive();
  return n;
}

/* ---- trip management ---- */
const tripTitle = t => (t && t.name) ? t.name : fmtDate(t && t.date);

function renameTrip(tripId, name) {
  const t = S.trips.find(x => x.id === tripId); if (!t) return null;
  const clean = String(name || '').trim();
  if (clean) t.name = clean; else delete t.name;     /* blank = back to the date */
  Persist.saveTrip(t);
  return t;
}

/* Does this price record belong to this trip? New records carry tripId.
   Older ones are matched on every field the trip wrote — date, product,
   store and price — so a same-day price from another store is never taken. */
function recordFromTrip(entry, trip, product) {
  if (entry.tripId) return entry.tripId === trip.id;
  if (entry.date !== trip.date) return false;
  return (trip.items || []).some(it =>
    it.checked && it.productId === product.id &&
    (it.storeId || null) === (entry.storeId || null) &&
    effectiveUnitPrice(it) === entry.price);
}

/* Work out everything a deletion would change, without changing anything. */
function tripDeletionPlan(tripId) {
  const trip = S.trips.find(x => x.id === tripId); if (!trip) return null;
  const others = S.trips.filter(x => x.id !== tripId);
  const plan = { trip, priceRecords: 0, products: [], purchaseReverted: 0, stillInCatalog: 0 };
  const touched = new Set((trip.items || []).filter(i => i.checked).map(i => i.productId));
  for (const pid of touched) {
    const p = productById(pid);
    if (!p) continue;
    plan.stillInCatalog++;
    const drop = (p.priceHistory || []).filter(e => recordFromTrip(e, trip, p)).length;
    /* purchase fields fall back to the most recent remaining trip that bought it */
    let prev = null;
    for (const t of others) {
      const it = (t.items || []).find(i => i.checked && i.productId === pid);
      if (it && (!prev || String(t.date) > String(prev.t.date))) prev = { t, it };
    }
    const next = prev
      ? { lastPurchased: prev.t.date, lastStoreId: prev.it.storeId || null,
          typicalQty: prev.it.unitType === 'weight' ? prev.it.weight : prev.it.qty }
      : { lastPurchased: null, lastStoreId: null, typicalQty: null };
    /* only rewrite purchase fields if they currently point at this trip */
    const pointsHere = p.lastPurchased === trip.date;
    plan.priceRecords += drop;
    if (pointsHere) plan.purchaseReverted++;
    plan.products.push({ p, drop, pointsHere, next });
  }
  return plan;
}

function deleteTrip(tripId) {
  const plan = tripDeletionPlan(tripId); if (!plan) return null;
  const { trip } = plan;
  for (const { p, drop, pointsHere, next } of plan.products) {
    if (!drop && !pointsHere) continue;
    if (drop) p.priceHistory = (p.priceHistory || []).filter(e => !recordFromTrip(e, trip, p));
    if (pointsHere) Object.assign(p, next);
    Persist.saveProduct(p);            /* the product itself is never removed */
  }
  S.trips = S.trips.filter(x => x.id !== tripId);
  Persist.deleteTrip(tripId);
  return plan;
}

function finishTrip() {
  const list = S.active;
  if (!list) return;
  const date = todayISO();
  const totals = computeTotals(list);
  const trip = {
    id: uid('trip'), date, taxRate: Number(S.settings.taxRate) || 0,
    items: JSON.parse(JSON.stringify(list.items)),
    totals: { subtotal: totals.purchased, tax: totals.tax, total: totals.purchased + totals.tax }
  };
  /* tax applies to the purchased subtotal */
  trip.totals.tax = trip.totals.subtotal * (trip.taxRate / 100);
  trip.totals.total = trip.totals.subtotal + trip.totals.tax;

  /* price + purchase history */
  const changes = [];
  for (const it of trip.items) {
    if (!it.checked) continue;
    const p = productById(it.productId);
    if (!p) continue;
    const price = effectiveUnitPrice(it);
    if (price != null) {
      /* tripId ties the record to the trip that created it, so deleting the
         trip can remove exactly its records and nothing else */
      p.priceHistory = (p.priceHistory || []).concat([{ price, storeId: it.storeId || null, date, tripId: trip.id }]);
      if (p.priceHistory.length > 40) p.priceHistory = p.priceHistory.slice(-40);
      if (it.actualPrice != null && it.actualPrice !== p.usualPrice) {
        changes.push({ productId: p.id, name: p.name, old: p.usualPrice, next: it.actualPrice });
      }
    }
    p.lastPurchased = date;
    p.lastStoreId = it.storeId || null;
    p.typicalQty = it.unitType === 'weight' ? it.weight : it.qty;
    if (p.stock !== 'in') p.stock = 'in';
    Persist.saveProduct(p);
  }

  S.trips.unshift(trip);
  Persist.saveTrip(trip);
  S.active = null;
  Persist.saveActive();

  closeSheet();
  go('home');
  if (changes.length) sheetUpdatePrices(changes);
  else toast('Trip saved to History');
}

/* ---------------- start ---------------- */
document.body.insertAdjacentHTML('afterbegin', PR_SPRITE());
render();
boot();
</script>
